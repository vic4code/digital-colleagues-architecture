<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 908" role="img"><title>Proactive mechanism comparison</title><g font-family="system-ui,sans-serif" fill="#292524"><text x="15" y="35" font-size="15" font-weight="600">Framework</text><text x="15" y="58" font-size="12" fill="#57534e">框架</text><text x="237" y="35" font-size="15" font-weight="600">A saved time arrives</text><text x="237" y="58" font-size="12" fill="#57534e">既定時間到了</text><text x="577" y="35" font-size="15" font-weight="600">An event or assignment arrives</text><text x="577" y="58" font-size="12" fill="#57534e">事件或交付事項到了</text><text x="917" y="35" font-size="15" font-weight="600">Current work ends</text><text x="917" y="58" font-size="12" fill="#57534e">目前工作結束了</text><path d="M10 80H1270" stroke="#e7e5e4"/><text x="15" y="108" font-size="15" font-weight="600">OpenClaw</text><text x="15" y="130" font-size="12" font-weight="400"></text><text x="15" y="152" font-size="12" font-weight="400">Many wake sources</text><text x="15" y="174" font-size="12" font-weight="400">多種喚醒來源</text><a href="show-me-proactive-lifecycle.html#flow-claw-0"><rect x="232" y="90" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="245" y="115" font-size="14">Heartbeat; Automations</text><text x="245" y="145" font-size="12" fill="#57534e">定期檢查與既定排程</text></a><a href="show-me-proactive-lifecycle.html#flow-claw-2"><rect x="572" y="90" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="585" y="115" font-size="14">HTTP hooks; stream; condition</text><text x="585" y="137" font-size="14">watchers</text><text x="585" y="167" font-size="12" fill="#57534e">HTTP、串流與條件事件</text></a><a href="show-me-proactive-lifecycle.html#flow-claw-3"><rect x="912" y="90" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="925" y="115" font-size="14">on-exit; Workshop review</text><text x="925" y="145" font-size="12" fill="#57534e">命令完成觸發／工作後回顧</text></a><path d="M10 193H1270" stroke="#e7e5e4"/><text x="15" y="221" font-size="15" font-weight="600">Hermes</text><text x="15" y="243" font-size="12" font-weight="400"></text><text x="15" y="265" font-size="12" font-weight="400">Several continuation</text><text x="15" y="287" font-size="12" font-weight="400">controls</text><text x="15" y="309" font-size="12" font-weight="400">不同工作有不同續跑控制</text><a href="show-me-proactive-lifecycle.html#flow-hermes-0"><rect x="232" y="203" width="326" height="115" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="245" y="228" font-size="14">Cron; /heartbeat; /loop</text><text x="245" y="258" font-size="12" fill="#57534e">排程與對話內週期工作</text></a><a href="show-me-proactive-lifecycle.html#flow-hermes-1"><rect x="572" y="203" width="326" height="115" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="585" y="228" font-size="14">Webhooks; Kanban readiness</text><text x="585" y="258" font-size="12" fill="#57534e">外部事件／任務就緒派工</text></a><a href="show-me-proactive-lifecycle.html#flow-hermes-4"><rect x="912" y="203" width="326" height="115" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="925" y="228" font-size="14">/goal continuation; review</text><text x="925" y="258" font-size="12" fill="#57534e">判斷既定目標是否需要續跑</text></a><path d="M10 328H1270" stroke="#e7e5e4"/><text x="15" y="356" font-size="15" font-weight="600">OpenBot</text><text x="15" y="378" font-size="12" font-weight="400"></text><text x="15" y="400" font-size="12" font-weight="400">Durable assignment &amp; handoff</text><text x="15" y="422" font-size="12" font-weight="400">交付工作與跨 Bot 派工</text><a href="show-me-proactive-lifecycle.html#flow-ob-0"><rect x="232" y="338" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="245" y="363" font-size="14">Routines</text><text x="245" y="393" font-size="12" fill="#57534e">定時執行常設指令</text></a><a href="show-me-proactive-lifecycle.html#flow-ob-1"><rect x="572" y="338" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="585" y="363" font-size="14">message_bot handoff</text><text x="585" y="393" font-size="12" fill="#57534e">另一個 Bot 交付工作</text></a><a href="show-me-proactive-lifecycle.html#flow-ob-2"><rect x="912" y="338" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="925" y="363" font-size="14">Handoff result relay</text><text x="925" y="393" font-size="12" fill="#57534e">成果回送原請求方</text></a><path d="M10 441H1270" stroke="#e7e5e4"/><text x="15" y="469" font-size="15" font-weight="600">Grok reconstruction</text><text x="15" y="491" font-size="12" font-weight="400"></text><text x="15" y="513" font-size="12" font-weight="400">Resume waiting conversations</text><text x="15" y="535" font-size="12" font-weight="400">接續等待中的對話</text><rect x="232" y="451" width="326" height="93" rx="4" fill="#fafaf9" stroke="#d6d3d1"/><text x="245" y="476" font-size="14">—</text><a href="show-me-proactive-lifecycle.html#flow-gr-0"><rect x="572" y="451" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="585" y="476" font-size="14">Automation / background event wakes</text><text x="585" y="506" font-size="12" fill="#57534e">收到執行紀錄或背景事件</text></a><a href="show-me-proactive-lifecycle.html#flow-gr-2"><rect x="912" y="451" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="925" y="476" font-size="14">Completion revivals</text><text x="925" y="506" font-size="12" fill="#57534e">子工作完成後喚回主對話</text></a><path d="M10 554H1270" stroke="#e7e5e4"/><text x="15" y="582" font-size="15" font-weight="600">Voyager</text><text x="15" y="604" font-size="12" font-weight="400"></text><text x="15" y="626" font-size="12" font-weight="400">Outcome-driven exploration</text><text x="15" y="648" font-size="12" font-weight="400">以成果驅動領域內探索</text><rect x="232" y="564" width="326" height="93" rx="4" fill="#fafaf9" stroke="#d6d3d1"/><text x="245" y="589" font-size="14">No clock wake needed by learn()</text><text x="245" y="619" font-size="12" fill="#57534e">已查核學習迴圈不需時鐘喚醒</text><a href="show-me-proactive-lifecycle.html#flow-v-1"><rect x="572" y="564" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="585" y="589" font-size="14">Environment feedback inside rollout</text><text x="585" y="619" font-size="12" fill="#57534e">從進行中的任務取得環境回饋</text></a><a href="show-me-proactive-lifecycle.html#flow-v-1"><rect x="912" y="564" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="925" y="589" font-size="14">Critic feedback; retry / progress</text><text x="925" y="619" font-size="12" fill="#57534e">評估成果、重試或更新進度</text></a><path d="M10 667H1270" stroke="#e7e5e4"/><text x="15" y="695" font-size="15" font-weight="600">Codex · official</text><text x="15" y="717" font-size="12" font-weight="400"></text><text x="15" y="739" font-size="12" font-weight="400">App schedule / runtime goal</text><text x="15" y="761" font-size="12" font-weight="400">App 排程與 runtime 目標續跑</text><a href="show-me-proactive-lifecycle.html#flow-cx-0"><rect x="232" y="677" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="245" y="702" font-size="14">Scheduled tasks (app)</text><text x="245" y="732" font-size="12" fill="#57534e">獨立或原對話排程</text></a><a href="show-me-proactive-lifecycle.html#flow-cx-2"><rect x="572" y="677" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="585" y="702" font-size="14">Custom listener → exec / App Server</text><text x="585" y="732" font-size="12" fill="#57534e">外部監聽由整合程式提供</text></a><a href="show-me-proactive-lifecycle.html#flow-cx-1"><rect x="912" y="677" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="925" y="702" font-size="14">/goal idle continuation; notify</text><text x="925" y="732" font-size="12" fill="#57534e">目標續跑／回合結束通知</text></a><path d="M10 780H1270" stroke="#e7e5e4"/><text x="15" y="808" font-size="15" font-weight="600">Claude Code · official</text><text x="15" y="830" font-size="12" font-weight="400"></text><text x="15" y="852" font-size="12" font-weight="400">Session / desktop / cloud</text><text x="15" y="874" font-size="12" font-weight="400">依不同執行環境選機制</text><a href="show-me-proactive-lifecycle.html#flow-cc-0"><rect x="232" y="790" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="245" y="815" font-size="14">/loop; Desktop tasks; Routines</text><text x="245" y="845" font-size="12" fill="#57534e">對話、本機或雲端排程</text></a><a href="show-me-proactive-lifecycle.html#flow-cc-2"><rect x="572" y="790" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="585" y="815" font-size="14">Channels; Monitor; Routines triggers</text><text x="585" y="845" font-size="12" fill="#57534e">頻道、監看與雲端觸發</text></a><a href="show-me-proactive-lifecycle.html#flow-cc-5"><rect x="912" y="790" width="326" height="93" rx="4" fill="#fff7ed" stroke="#fdba74"/><text x="925" y="815" font-size="14">Hooks; loop recurrence</text><text x="925" y="845" font-size="12" fill="#57534e">生命週期回呼與迴圈</text></a></g></svg>