<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 492" role="img" aria-labelledby="title"><style id="research-diagram-font">text,tspan{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif!important;font-kerning:normal}</style><title id="title">Voyager: Automatic curriculum</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#076fc9"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="system-ui,sans-serif" font-size="15" fill="#202823"><rect x="5.0" y="14" width="130" height="44" rx="5" fill="#e5f1fd"/><text x="70.0" y="41" text-anchor="middle">learn loop</text><path d="M70.0 62V476" stroke="#b8c5ce" stroke-dasharray="5 5"/><rect x="278.3333333333333" y="14" width="130" height="44" rx="5" fill="#e5f1fd"/><text x="343.3333333333333" y="41" text-anchor="middle">Curriculum</text><path d="M343.3333333333333 62V476" stroke="#b8c5ce" stroke-dasharray="5 5"/><rect x="551.6666666666666" y="14" width="130" height="44" rx="5" fill="#e5f1fd"/><text x="616.6666666666666" y="41" text-anchor="middle">Environment</text><path d="M616.6666666666666 62V476" stroke="#b8c5ce" stroke-dasharray="5 5"/><rect x="825.0" y="14" width="130" height="44" rx="5" fill="#e5f1fd"/><text x="890.0" y="41" text-anchor="middle">Skill library</text><path d="M890.0 62V476" stroke="#b8c5ce" stroke-dasharray="5 5"/><path d="M70.0 104H343.3333333333333" stroke="#076fc9" marker-end="url(#arrow)"/><text x="206.66666666666666" y="93" text-anchor="middle" font-size="14">propose_next_task(state, history)</text><path d="M343.3333333333333 166H70.0" stroke="#076fc9" marker-end="url(#arrow)"/><text x="206.66666666666666" y="155" text-anchor="middle" font-size="14">Return new task</text><path d="M70.0 228H616.6666666666666" stroke="#076fc9" marker-end="url(#arrow)"/><text x="343.3333333333333" y="217" text-anchor="middle" font-size="14">rollout(code) + feedback / critic</text><path d="M616.6666666666666 290H70.0" stroke="#076fc9" marker-end="url(#arrow)"/><text x="343.3333333333333" y="279" text-anchor="middle" font-size="14">Return result</text><path d="M70.0 352H890.0" stroke="#076fc9" marker-end="url(#arrow)"/><text x="480.0" y="341" text-anchor="middle" font-size="14">On success: store skill</text><path d="M70.0 414H343.3333333333333" stroke="#076fc9" marker-end="url(#arrow)"/><text x="206.66666666666666" y="403" text-anchor="middle" font-size="14">Direct next iteration</text></g></svg>