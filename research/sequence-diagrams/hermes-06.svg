<svg class="sequence-svg" viewBox="0 0 720 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seq-hermes-5-title"><title id="seq-hermes-5-title">Kanban dispatcher sequence diagram</title><defs><marker id="seq-hermes-5-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78716c"/></marker><marker id="seq-hermes-5-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b43b0c"/></marker></defs><rect x="12.0" y="12" width="136" height="58" rx="5" fill="#fafafa" stroke="#d6d3d1"/><text x="80.0" y="35" text-anchor="middle" font-size="14" fill="#292524">Board dispatcher</text><path d="M80.0 70V462" stroke="#d6d3d1" stroke-dasharray="4 4"/><rect x="198.66666666666663" y="12" width="136" height="58" rx="5" fill="#fafafa" stroke="#d6d3d1"/><text x="266.66666666666663" y="35" text-anchor="middle" font-size="14" fill="#292524">Ready task rows</text><path d="M266.66666666666663 70V462" stroke="#d6d3d1" stroke-dasharray="4 4"/><rect x="385.3333333333333" y="12" width="136" height="58" rx="5" fill="#fafafa" stroke="#d6d3d1"/><text x="453.3333333333333" y="35" text-anchor="middle" font-size="14" fill="#292524">Lane dispatcher</text><path d="M453.3333333333333 70V462" stroke="#d6d3d1" stroke-dasharray="4 4"/><rect x="572.0" y="12" width="136" height="58" rx="5" fill="#fafafa" stroke="#d6d3d1"/><text x="640.0" y="35" text-anchor="middle" font-size="14" fill="#292524">Worker process</text><path d="M640.0 70V462" stroke="#d6d3d1" stroke-dasharray="4 4"/><g class="sequence-message"><rect x="72.0" y="74" width="202.66666666666663" height="65" fill="transparent"/><path d="M80.0 116H266.66666666666663" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#seq-hermes-5-plain)"/><text x="173.33333333333331" y="87" text-anchor="middle" font-size="13" fill="#78716c" paint-order="stroke" stroke="white" stroke-width="4">1. Read ready work and</text><text x="173.33333333333331" y="104" text-anchor="middle" font-size="13" fill="#78716c" paint-order="stroke" stroke="white" stroke-width="4">capacity</text></g><g class="sequence-message"><rect x="72.0" y="150" width="202.66666666666663" height="65" fill="transparent"/><path d="M266.66666666666663 192H80.0" fill="none" stroke="#78716c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#seq-hermes-5-plain)"/><text x="173.33333333333331" y="180" text-anchor="middle" font-size="13" fill="#78716c" paint-order="stroke" stroke="white" stroke-width="4">2. Rows and assignments</text></g><g class="sequence-message has-code"><rect x="72.0" y="226" width="245" height="65" fill="transparent"/><path d="M80.0 268h34v18h-34" fill="none" stroke="#b43b0c" stroke-width="1.6" marker-end="url(#seq-hermes-5-code)"/><text x="125.0" y="239" text-anchor="start" font-size="13" fill="#b43b0c" paint-order="stroke" stroke="white" stroke-width="4">3. Check budget / resolve</text><text x="125.0" y="256" text-anchor="start" font-size="13" fill="#b43b0c" paint-order="stroke" stroke="white" stroke-width="4">assignee</text></g><g class="sequence-message has-code"><rect x="72.0" y="302" width="389.3333333333333" height="65" fill="transparent"/><path d="M80.0 344H453.3333333333333" fill="none" stroke="#b43b0c" stroke-width="1.6" marker-end="url(#seq-hermes-5-code)"/><text x="266.66666666666663" y="332" text-anchor="middle" font-size="13" fill="#b43b0c" paint-order="stroke" stroke="white" stroke-width="4">4. _dispatch_lane_task</text></g><g class="sequence-message"><rect x="445.3333333333333" y="378" width="202.66666666666669" height="65" fill="transparent"/><path d="M453.3333333333333 420H640.0" fill="none" stroke="#78716c" stroke-width="1.6" marker-end="url(#seq-hermes-5-plain)"/><text x="546.6666666666666" y="391" text-anchor="middle" font-size="13" fill="#78716c" paint-order="stroke" stroke="white" stroke-width="4">5. Claim and spawn</text><text x="546.6666666666666" y="