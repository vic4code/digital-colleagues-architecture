<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
<title>Agent 產品與數位同事的能力對照</title>
<desc>雷達圖:八個能力維度上,現成 agent 產品與我們要打造的數位同事的覆蓋差異。競品集中在能力、產品UX、工具整合;我們的目標覆蓋組織身分、治理、組織世界觀,但在工具整合與產品UX上較弱。</desc>
