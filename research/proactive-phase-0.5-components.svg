<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" role="img" aria-labelledby="embed-title embed-desc"><title id="embed-title">Embed proactive behavior into the existing Phase 0.5 components</title><desc id="embed-desc">Scheduler, event ingress and interaction requests enter the adopted Runtime Controller. Existing triage, skill loading, session mapping and app-server control retain ownership. Dashed policy hooks add phase-specific completion and proposal gates. State and private inbox remain separate. Agent results return to policy; only eligible continuation returns to admission.</desc><defs><marker id="embed-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#78716c"/></marker></defs><g font-family="system-ui,sans-serif" fill="#292524"><text x="25" y="28" font-size="20" font-weight="700">Existing ownership, phase-specific integration / 既有責任與各 phase 接合</text><rect x="25" y="55" width="260" height="105" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="40" y="80" font-size="15" font-weight="600">Interaction Client</text><text x="40" y="103" font-size="12" fill="#57534e">Human assignment / 人交付工作</text><text x="40" y="123" font-size="12" fill="#57534e">P2: goal + completion contract</text><rect x="310" y="55" width="260" height="105" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="325" y="80" font-size="15" font-weight="600">Polling Scheduler</text><text x="325" y="103" font-size="12" fill="#57534e">P1: fixed cadence / 固定節律</text><text x="325" y="123" font-size="12" fill="#57534e">Reuse supported runtime scheduler</text><rect x="595" y="55" width="260" height="105" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="610" y="80" font-size="15" font-weight="600">Event Ingress</text><text x="610" y="103" font-size="12" fill="#57534e">Verify, deduplicate, buffer</text><text x="610" y="123" font-size="12" fill="#57534e">P1 facts → P3 evidence anchors</text><rect x="25" y="195" width="790" height="590" rx="12" fill="white" stroke="#c2410c" stroke-width="1.5"/><text x="45" y="223" font-size="17" font-weight="700" fill="#9a3412">Runtime Controller · adopted framework / 採用框架承擔</text><rect x="50" y="245" width="235" height="90" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="65" y="270" font-size="15" font-weight="600">Interaction Adapter</text><text x="65" y="293" font-size="12" fill="#57534e">Normalize identity + request</text><text x="65" y="313" font-size="12" fill="#57534e">Existing C3 component</text><rect x="345" y="245" width="435" height="90" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="360" y="270" font-size="15" font-weight="600">Event Normalizer</text><text x="360" y="293" font-size="12" fill="#57534e">Keep occurrence/task/source identity</text><text x="360" y="313" font-size="12" fill="#57534e">Preserve accepted event facts and anchors</text><path d="M155 160V242" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><path d="M440 160V242" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><path d="M725 160V242" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><rect x="50" y="375" width="300" height="100" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="65" y="400" font-size="15" font-weight="600">Triage Policy</text><text x="65" y="423" font-size="12" fill="#57534e">P1: ignore / deliver-only / reason</text><text x="65" y="443" font-size="12" fill="#57534e">P2/P3: eligible work enters here</text><text x="65" y="463" font-size="12" fill="#57534e">Use code; no LLM for admission</text><path d="M168 335V372" fill="none" stroke="#78716c" stroke-width="1.4" marker-end="url(#embed-arrow)"/><path d="M430 335V355H200V372" fill="none" stroke="#78716c" stroke-width="1.4" marker-end="url(#embed-arrow)"/><rect x="425" y="375" width="355" height="100" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="440" y="400" font-size="15" font-weight="600">Persona + Skill Loader</text><text x="440" y="423" font-size="12" fill="#57534e">P1 fixed output; P2 goal context</text><text x="440" y="443" font-size="12" fill="#57534e">P3 event-grounded proposal skill</text><text x="440" y="463" font-size="12" fill="#57534e">Use existing workspace / tool policies</text><rect x="50" y="515" width="300" height="100" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="65" y="540" font-size="15" font-weight="600">Session / Thread Mapper</text><text x="65" y="563" font-size="12" fill="#57534e">Bind task, thread and colleague</text><text x="65" y="583" font-size="12" fill="#57534e">Resume only owned work</text><text x="65" y="603" font-size="12" fill="#57534e">Existing runtime/harness responsibility</text><path d="M200 475V512" fill="none" stroke="#78716c" stroke-width="1.4" marker-end="url(#embed-arrow)"/><path d="M425 425H380V565H353" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><rect x="50" y="655" width="300" height="100" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="65" y="680" font-size="15" font-weight="600">App-server Client</text><text x="65" y="703" font-size="12" fill="#57534e">Start/resume thread; start turn</text><text x="65" y="723" font-size="12" fill="#57534e">Consume runtime/engine outcomes</text><text x="65" y="743" font-size="12" fill="#57534e">P2: budget check before dispatch</text><path d="M200 615V652" fill="none" stroke="#78716c" stroke-width="1.4" marker-end="url(#embed-arrow)"/><rect x="425" y="515" width="355" height="145" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-dasharray="6 4"/><text x="440" y="540" font-size="15" font-weight="600">Approval + Audit Policy</text><text x="440" y="563" font-size="12" fill="#57534e">P1 run / skip / delivery records</text><text x="440" y="583" font-size="12" fill="#57534e">P2 evidence + token/time/turn caps</text><text x="440" y="603" font-size="12" fill="#57534e">P3 independent proposal gates</text><text x="440" y="623" font-size="12" fill="#57534e">Dashed: phase contracts to integrate</text><text x="440" y="643" font-size="12" fill="#57534e">虛線：待接合契約，不是新服務</text><path d="M425 557H386V397H353" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><text x="364" y="492" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">eligible continuation only</text><path d="M425 615H370V705H353" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><text x="354" y="687" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">admit turn</text><rect x="855" y="245" width="240" height="180" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="870" y="270" font-size="15" font-weight="600">Colleague State</text><text x="870" y="293" font-size="12" fill="#57534e">P1 occurrences / run history</text><text x="870" y="313" font-size="12" fill="#57534e">P2 goals / waits / budgets</text><text x="870" y="333" font-size="12" fill="#57534e">P3 candidates / anchors</text><text x="870" y="353" font-size="12" fill="#57534e">Read + rejection feedback</text><text x="870" y="373" font-size="12" fill="#57534e">Reuse stores; add missing</text><text x="870" y="393" font-size="12" fill="#57534e">business records only</text><path d="M780 290H852" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><text x="793" y="278" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">source context</text><path d="M780 595H831V390H852" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><text x="829" y="461" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">persist state</text><rect x="855" y="515" width="240" height="145" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="870" y="540" font-size="15" font-weight="600">Private inbox / UI</text><text x="870" y="563" font-size="12" fill="#57534e">P1 reports; P2 draft/result</text><text x="870" y="583" font-size="12" fill="#57534e">P3 gated proposals</text><text x="870" y="603" font-size="12" fill="#57534e">Human read/reject feedback</text><text x="870" y="623" font-size="12" fill="#57534e">No public board writes</text><path d="M780 565H852" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><text x="795" y="550" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">admitted output</text><path d="M975 515V428" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><text x="984" y="474" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">feedback</text><rect x="50" y="825" width="300" height="105" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="65" y="850" font-size="15" font-weight="600">Codex app-server</text><text x="65" y="873" font-size="12" fill="#57534e">Run model + tool loop</text><text x="65" y="893" font-size="12" fill="#57534e">P3: candidate generation here</text><text x="65" y="913" font-size="12" fill="#57534e">Engine remains execution owner</text><path d="M200 755V822" fill="none" stroke="#78716c" stroke-width="1.4" marker-end="url(#embed-arrow)"/><text x="211" y="803" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">turn control</text><rect x="425" y="825" width="355" height="105" rx="8" fill="#fafaf9" stroke="#a8a29e"/><text x="440" y="850" font-size="15" font-weight="600">MCP tool servers / integrations</text><text x="440" y="873" font-size="12" fill="#57534e">Read evidence through allowed tools</text><text x="440" y="893" font-size="12" fill="#57534e">Outbound calls happen within a turn</text><text x="440" y="913" font-size="12" fill="#57534e">MCP is not the unsolicited wake entry</text><path d="M350 876H422" fill="none" stroke="#78716c" stroke-width="1.4" marker-end="url(#embed-arrow)"/><text x="365" y="861" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">tool calls</text><path d="M350 906H402V633H422" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#embed-arrow)"/><text x="369" y="748" font-size="11" fill="#57534e" paint-order="stroke" stroke="#fff" stroke-width="4">outcome / completion</text><text x="25" y="986" font-size="12">Solid boxes: existing architecture roles. Dashed policy box: phase-specific behavior to verify or integrate.</text><text x="25" y="1008" font-size="12">實線框：既有架構責任。虛線框：各 phase 要驗證或接合的政策行為；不是重寫框架核心。</text><text x="25" y="1042" font-size="12">Gray = infrastructure; orange = agent/runtime ownership. Solid arrows = calls; dashed arrows = events/state/results.</text></g></svg>