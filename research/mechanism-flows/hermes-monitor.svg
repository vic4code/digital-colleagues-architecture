<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 450" role="img" aria-labelledby="hermes-monitor-title" style="font-family:system-ui,sans-serif"><title id="hermes-monitor-title">Hermes Cron monitor-mode change detection and notification gates</title><rect width="950" height="450" fill="white"/><text x="20" y="30" font-size="18" font-weight="600">Cron · monitor mode / 先查看變化，再決定是否喚醒</text><rect x="20" y="65" width="230" height="65" fill="#fafaf9" stroke="#aaa"/><text x="32" y="92" font-size="14">Cron tick → check_monitor</text><text x="32" y="115" font-size="12">Run monitor_script / fetch URL</text><path d="M250 98H305" stroke="#c2410c"/><rect x="305" y="65" width="270" height="65" fill="#fff7ed" stroke="#fdba74"/><text x="317" y="92" font-size="14">Compare exact output hash</text><text x="317" y="115" font-size="12">和上次觀察內容比較</text><path d="M440 130V165H160V200M440 165V200M440 165H750V200" fill="none" stroke="#c2410c"/><rect x="20" y="200" width="265" height="75" fill="#fafaf9" stroke="#aaa"/><text x="32" y="227" font-size="14">Unchanged → no_change</text><text x="32" y="252" font-size="12">Skip model + delivery / 不喚醒、不通知</text><rect x="320" y="200" width="265" height="75" fill="#fff7ed" stroke="#fdba74"/><text x="332" y="227" font-size="14">Changed / first observation</text><text x="332" y="252" font-size="12">Save baseline → pass context to agent</text><rect x="630" y="200" width="295" height="75" fill="#fafaf9" stroke="#aaa"/><text x="642" y="227" font-size="14">Source error → failure result</text><text x="642" y="252" font-size="12">Keep previous hash / 不當作新變化</text><path d="M450 275V320" stroke="#c2410c"/><rect x="275" y="320" width="375" height="70" fill="#fff7ed" stroke="#fdba74"/><text x="289" y="347" font-size="14">Agent judges what matters and returns output</text><text x="289" y="372" font-size="12">Successful [SILENT] → quiet; otherwise delivery policy</text><text x="20" y="425" font-size="12" fill="#666">Source selection is configured. Hash equality is a byte-level check, not a semantic importance judgment.</text></svg>