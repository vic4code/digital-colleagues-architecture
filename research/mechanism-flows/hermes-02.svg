<svg class="mechanism-svg" viewBox="0 0 680 470" role="img" aria-labelledby="mech-hermes-1-title mech-hermes-1-desc" xmlns="http://www.w3.org/2000/svg"><title id="mech-hermes-1-title">Webhooks — proactive flow</title><desc id="mech-hermes-1-desc">External POST /webhooks/{route} → Authenticate → event / payload / script filters → Render prompt; deduplicate delivery identifier → MessageEvent → handle_message → response route. Branch: deliver_only:true → Deliver rendered text; no model</desc><defs><marker id="mech-hermes-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78716c"/></marker></defs><rect x="20" y="20" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="36" font-size="12" text-anchor="end" fill="#666">1</text><text x="35" y="49" font-size="16" fill="#292524">External POST /webhooks/{route}</text><path d="M212 100V123" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-hermes-1-arrow)"/><rect x="20" y="126" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="142" font-size="12" text-anchor="end" fill="#666">2</text><text x="35" y="155" font-size="16" fill="#292524">Authenticate → event / payload / script</text><text x="35" y="176" font-size="16" fill="#292524">filters</text><path d="M212 206V229" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-hermes-1-arrow)"/><rect x="20" y="232" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="248" font-size="12" text-anchor="end" fill="#666">3</text><text x="35" y="261" font-size="16" fill="#292524">Render prompt; deduplicate delivery</text><text x="35" y="282" font-size="16" fill="#292524">identifier</text><path d="M212 312V335" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-hermes-1-arrow)"/><rect x="20" y="338" width="385" height="80" rx="8" fill="#fff7ed" stroke="#fb923c"/><text x="393" y="354" font-size="12" text-anchor="end" fill="#666">4</text><text x="35" y="367" font-size="16" fill="#292524">MessageEvent → handle_message → response</text><text x="35" y="388" font-size="16" fill="#292524">route</text><path d="M405 272H444" fill="none" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mech-hermes-1-arrow)"/><rect x="450" y="222" width="212" height="115" rx="8" fill="#fff" stroke="#d6d3d1" stroke-dasharray="4 3"/><text x="462" y="244" font-size="13" fill="#292524">deliver_only:true</text><text x="462" y="286" font-size="14" fill="#292524">Deliver rendered text;</text><text x="462" y="307" font-size="14" fill="#292524">no model</text><text x="20" y="454" font-size="13" fill="#78716c">Solid arrows: traced path · Dashed branch: alternative / evidence limit</text></svg>