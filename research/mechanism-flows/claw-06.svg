<svg class="mechanism-svg" viewBox="0 0 680 470" role="img" aria-labelledby="mech-claw-5-title mech-claw-5-desc" xmlns="http://www.w3.org/2000/svg"><title id="mech-claw-5-title">Automations · condition watchers — proactive flow</title><desc id="mech-claw-5-desc">Scheduled check OR stream batch arrives → Run trigger.script with saved state / input → Evaluate returned fire flag and optional message → fire:true → normal payload execution. Branch: fire:false → Skip payload; retain returned state</desc><defs><marker id="mech-claw-5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78716c"/></marker></defs><rect x="20" y="20" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="36" font-size="12" text-anchor="end" fill="#666">1</text><text x="35" y="49" font-size="16" fill="#292524">Scheduled check OR stream batch arrives</text><path d="M212 100V123" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-claw-5-arrow)"/><rect x="20" y="126" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="142" font-size="12" text-anchor="end" fill="#666">2</text><text x="35" y="155" font-size="16" fill="#292524">Run trigger.script with saved state /</text><text x="35" y="176" font-size="16" fill="#292524">input</text><path d="M212 206V229" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-claw-5-arrow)"/><rect x="20" y="232" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="248" font-size="12" text-anchor="end" fill="#666">3</text><text x="35" y="261" font-size="16" fill="#292524">Evaluate returned fire flag and optional</text><text x="35" y="282" font-size="16" fill="#292524">message</text><path d="M212 312V335" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-claw-5-arrow)"/><rect x="20" y="338" width="385" height="80" rx="8" fill="#fff7ed" stroke="#fb923c"/><text x="393" y="354" font-size="12" text-anchor="end" fill="#666">4</text><text x="35" y="367" font-size="16" fill="#292524">fire:true → normal payload execution</text><path d="M405 272H444" fill="none" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mech-claw-5-arrow)"/><rect x="450" y="222" width="212" height="115" rx="8" fill="#fff" stroke="#d6d3d1" stroke-dasharray="4 3"/><text x="462" y="244" font-size="13" fill="#292524">fire:false</text><text x="462" y="286" font-size="14" fill="#292524">Skip payload; retain</text><text x="462" y="307" font-size="14" fill="#292524">returned state</text><text x="20" y="454" font-size="13" fill="#78716c">Solid arrows: traced path · Dashed branch: alternative / evidence limit</text></svg>