<svg class="mechanism-svg" viewBox="0 0 680 470" role="img" aria-labelledby="mech-ob-2-title mech-ob-2-desc" xmlns="http://www.w3.org/2000/svg"><title id="mech-ob-2-title">Handoff result relay — proactive flow</title><desc id="mech-ob-2-desc">Delegated forward turn finishes with answer → Check forward hop and non-empty answer → Queue durable relay back to requesting Bot → Deliver follow-up; do not relay the relay. Branch: Already a relay / empty → No new result relay</desc><defs><marker id="mech-ob-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#78716c"/></marker></defs><rect x="20" y="20" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="36" font-size="12" text-anchor="end" fill="#666">1</text><text x="35" y="49" font-size="16" fill="#292524">Delegated forward turn finishes with</text><text x="35" y="70" font-size="16" fill="#292524">answer</text><path d="M212 100V123" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-ob-2-arrow)"/><rect x="20" y="126" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="142" font-size="12" text-anchor="end" fill="#666">2</text><text x="35" y="155" font-size="16" fill="#292524">Check forward hop and non-empty answer</text><path d="M212 206V229" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-ob-2-arrow)"/><rect x="20" y="232" width="385" height="80" rx="8" fill="#fafaf9" stroke="#d6d3d1"/><text x="393" y="248" font-size="12" text-anchor="end" fill="#666">3</text><text x="35" y="261" font-size="16" fill="#292524">Queue durable relay back to requesting</text><text x="35" y="282" font-size="16" fill="#292524">Bot</text><path d="M212 312V335" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#mech-ob-2-arrow)"/><rect x="20" y="338" width="385" height="80" rx="8" fill="#fff7ed" stroke="#fb923c"/><text x="393" y="354" font-size="12" text-anchor="end" fill="#666">4</text><text x="35" y="367" font-size="16" fill="#292524">Deliver follow-up; do not relay the</text><text x="35" y="388" font-size="16" fill="#292524">relay</text><path d="M405 166H444" fill="none" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mech-ob-2-arrow)"/><rect x="450" y="116" width="212" height="115" rx="8" fill="#fff" stroke="#d6d3d1" stroke-dasharray="4 3"/><text x="462" y="138" font-size="13" fill="#292524">Already a relay / empty</text><text x="462" y="180" font-size="14" fill="#292524">No new result relay</text><text x="20" y="454" font-size="13" fill="#78716c">Solid arrows: traced path · Dashed branch: alternative / evidence limit</text></svg>