<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" role="img" aria-labelledby="arch-overview-title arch-overview-desc"><title id="arch-overview-title">Our architecture: where proactive behavior fits</title><desc id="arch-overview-desc">Human requests and service events meet in the Runtime Controller. Codex executes work through tools. State preserves progress and delivery. Select a component to read proposed proactive integration work.</desc><defs><marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78716c"/></marker></defs><g font-family="system-ui,sans-serif"><rect x="20" y="25" width="230" height="65" rx="5" fill="#fafaf9" stroke="#d6d3d1"/><text x="36" y="52" font-size="15" font-weight="600" fill="#292524">You / 你</text><text x="36" y="74" font-size="12" fill="#57534e">Assign work · review results</text><rect x="640" y="25" width="310" height="65" rx="5" fill="#fafaf9" stroke="#d6d3d1"/><text x="656" y="52" font-size="15" font-weight="600" fill="#292524">Work systems / 工作系統</text><text x="656" y="74" font-size="12" fill="#57534e">Outlook · SharePoint · CI · APIs</text><a href="show-me-proactive-lifecycle.html#proactive-component-delivery" aria-label="Interaction Client: expand proactive implementation"><g class="architecture-node"><rect x="20" y="145" width="230" height="70" rx="5" fill="#fafaf9" stroke="#d6d3d1"/><text x="36" y="172" font-size="15" font-weight="600" fill="#292524">Interaction Client</text><text x="36" y="194" font-size="12" fill="#57534e">One private inbox / 單一私人介面</text></g></a><a href="show-me-proactive-lifecycle.html#proactive-component-ingress" aria-label="Scheduler + Event Ingress: expand proactive implementation"><g class="architecture-node"><rect x="640" y="145" width="310" height="70" rx="5" fill="#fafaf9" stroke="#d6d3d1"/><text x="656" y="172" font-size="15" font-weight="600" fill="#292524">Scheduler + Event Ingress</text><text x="656" y="194" font-size="12" fill="#57534e">Time or service event / 時間或事件</text></g></a><a href="show-me-proactive-lifecycle.html#proactive-component-runtime" aria-label="Runtime Controller: expand proactive implementation"><g class="architecture-node"><rect x="295" y="275" width="315" height="90" rx="5" fill="#fff7ed" stroke="#fdba74"/><text x="311" y="302" font-size="15" font-weight="600" fill="#292524">Runtime Controller</text><text x="311" y="324" font-size="12" fill="#57534e">Admit · route · continue / 判斷與派工</text></g></a><a href="show-me-proactive-lifecycle.html#proactive-component-state" aria-label="Colleague State: expand proactive implementation"><g class="architecture-node"><rect x="660" y="285" width="290" height="70" rx="5" fill="#fafaf9" stroke="#d6d3d1"/><text x="676" y="312" font-size="15" font-weight="600" fill="#292524">Colleague State</text><text x="676" y="334" font-size="12" fill="#57534e">Progress + delivery / 進度與送達狀態</text></g></a><a href="show-me-proactive-lifecycle.html#proactive-component-engine" aria-label="Codex app-server: expand proactive implementation"><g class="architecture-node"><rect x="295" y="435" width="315" height="75" rx="5" fill="#fff7ed" stroke="#fdba74"/><text x="311" y="462" font-size="15" font-weight="600" fill="#292524">Codex app-server</text><text x="311" y="484" font-size="12" fill="#57534e">Model + tool execution / 執行工作</text></g></a><a href="show-me-proactive-lifecycle.html#proactive-component-tools" aria-label="MCP / Tool Adapters: expand proactive implementation"><g class="architecture-node"><rect x="660" y="435" width="290" height="75" rx="5" fill="#fafaf9" stroke="#d6d3d1"/><text x="676" y="462" font-size="15" font-weight="600" fill="#292524">MCP / Tool Adapters</text><text x="676" y="484" font-size="12" fill="#57534e">Read data · act / 讀資料與執行操作</text></g></a><path d="M135 90V142" fill="none" stroke="#78716c" stroke-width="1.3" marker-end="url(#overview-arrow)"/><text x="146" y="122" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">request / 交辦</text><path d="M795 90V142" fill="none" stroke="#78716c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#overview-arrow)"/><text x="804" y="122" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">push / poll / 事件或查詢</text><path d="M135 215V320H292" fill="none" stroke="#78716c" stroke-width="1.3" marker-end="url(#overview-arrow)"/><text x="147" y="307" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">request / 交辦</text><path d="M795 215V247H450V272" fill="none" stroke="#78716c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#overview-arrow)"/><text x="540" y="238" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">accepted event / 已接受事件</text><path d="M295 345H270V180H253" fill="none" stroke="#78716c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#overview-arrow)"/><text x="274" y="238" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">result / 結果</text><path d="M610 320H657" fill="none" stroke="#78716c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#overview-arrow)"/><text x="617" y="308" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">state</text><path d="M405 365V432" fill="none" stroke="#78716c" stroke-width="1.3" marker-end="url(#overview-arrow)"/><text x="416" y="397" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">start / resume turn</text><path d="M535 435V368" fill="none" stroke="#78716c" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#overview-arrow)"/><text x="545" y="397" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">outcome / 工作結果</text><path d="M610 471H657" fill="none" stroke="#78716c" stroke-width="1.3" marker-end="url(#overview-arrow)"/><text x="619" y="459" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">tools</text><path d="M950 471H969V59H953" fill="none" stroke="#78716c" stroke-width="1.3" marker-end="url(#overview-arrow)"/><text x="945" y="400" font-size="11" fill="#57534e" paint-order="stroke" stroke="white" stroke-width="4">API</text><text x="20" y="549" font-size="12" fill="#57534e">Select a box to expand implementation. Solid: calls · Dashed: events, results or state.</text></g></svg>