<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="lgtitle" style="font-family:system-ui,sans-serif"><title id="lgtitle">How observation, loops and workflows fit together</title><rect width="1040" height="430" fill="white"/><text x="20" y="30" font-size="19" font-weight="600">One colleague, two connected responsibilities / 同一位同事的兩段工作</text><text x="20" y="61" font-size="13" fill="#666">Illustrative composition, not a native framework diagram / 組合示意，非官方內部架構</text><rect x="20" y="92" width="230" height="74" fill="#fafaf9" stroke="#aaa"/><text x="35" y="122" font-size="15">Schedule or event adapter</text><text x="35" y="147" font-size="13">時間到了／新消息到了</text><path d="M250 130H305" stroke="#c2410c" stroke-width="2"/><path d="M298 125L305 130L298 135" fill="none" stroke="#c2410c"/><rect x="305" y="92" width="280" height="74" fill="#fff7ed" stroke="#fdba74"/><text x="320" y="122" font-size="15">Read inbox; decide what matters</text><text x="320" y="147" font-size="13">查看信箱，判斷有沒有要處理的事</text><path d="M445 166V220H150V167" fill="none" stroke="#c2410c"/><text x="205" y="209" font-size="13">Check again later / 過一陣子再看</text><path d="M585 130H635" stroke="#c2410c" stroke-width="2"/><path d="M628 125L635 130L628 135" fill="none" stroke="#c2410c"/><rect x="635" y="92" width="370" height="74" fill="#fff7ed" stroke="#fdba74"/><text x="650" y="122" font-size="15">Notify the person or start invoice work</text><text x="650" y="147" font-size="13">通知人，或開始處理發票</text><path d="M820 166V270H145V295" fill="none" stroke="#c2410c"/><rect x="20" y="295" width="250" height="68" fill="#fafaf9" stroke="#aaa"/><text x="35" y="323" font-size="15">Extract invoice details</text><text x="35" y="347" font-size="13">先整理資料</text><path d="M270 330H345" stroke="#c2410c"/><rect x="345" y="295" width="290" height="68" fill="#fafaf9" stroke="#aaa"/><text x="360" y="323" font-size="15">Wait for review; resume on reply</text><text x="360" y="347" font-size="13">等待審核，收到回覆才繼續</text><path d="M635 330H710" stroke="#c2410c"/><rect x="710" y="295" width="295" height="68" fill="#fafaf9" stroke="#aaa"/><text x="725" y="323" font-size="15">Perform the permitted next action</text><text x="725" y="347" font-size="13">執行允許的後續處理</text><text x="20" y="402" font-size="13" fill="#666">Loop: revisit / continue. Workflow: order / wait / branch. A real source adapter supplies observations and replies.</text></svg>