<svg viewBox="0 0 840 960" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Channels through the adapter to codex app-server — protocol-level detail</title>
  <desc>Outlook and Teams channel ingress, adapter internals, the stdio JSON-RPC boundary with concrete message types in both directions, and codex app-server internals. Side panel shows that the VS Code / Cursor extension occupies the same client seat.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <style>
    .label { font-size: 13px; font-weight: 500; fill: #111827; }
    .sub { font-size: 11px; fill: #6b7280; }
    .port { font-size: 10px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .code { font-size: 10px; fill: #374151; font-family: ui-monospace, monospace; }
    .tier { font-size: 11px; font-weight: 500; fill: #6b7280; letter-spacing: 0.5px; text-transform: uppercase; }
    .edge { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
    .edgeAccent { stroke: #c2410c; stroke-width: 1.3; fill: none; }
    .edgeDash { stroke-dasharray: 4 3; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .boxFuture { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 3; }
    .boxAgent { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
    .boxOwned { fill: #ffffff; stroke: #6b7280; stroke-width: 1.4; }
    .boxShared { fill: #f9fafb; stroke: #d1d5db; stroke-dasharray: 4 3; stroke-width: 1; }
    .boxCloud { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; }
    .pill { fill: #f3f4f6; stroke: #e5e7eb; stroke-width: 1; }
    .band { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; }
    .edgeLabel { font-size: 10px; fill: #6b7280; font-family: ui-monospace, monospace; }
  </style>

  <!-- ===== Channels ===== -->
  <text x="20" y="28" class="tier">CHANNELS</text>
  <rect x="40" y="42" width="220" height="58" rx="30" class="boxCloud"/>
  <text x="150" y="64" text-anchor="middle" class="label">Outlook / Exchange Online</text>
  <text x="150" y="80" text-anchor="middle" class="port">Graph: GET delta · POST sendMail</text>
  <text x="150" y="94" text-anchor="middle" class="sub">personal mode · v0.1</text>

  <rect x="290" y="42" width="220" height="58" rx="30" class="boxFuture"/>
  <text x="400" y="64" text-anchor="middle" class="label">Microsoft Teams</text>
  <text x="400" y="80" text-anchor="middle" class="port">Azure Bot webhook (inbound!)</text>
  <text x="400" y="94" text-anchor="middle" class="sub">resident box only · later</text>

  <!-- ===== Side panel: the same seat ===== -->
  <rect x="560" y="42" width="250" height="300" rx="8" class="boxShared"/>
  <text x="576" y="66" class="label">The same seat as VS Code / Cursor</text>
  <text x="576" y="82" class="sub">The official IDE extension is itself a</text>
  <text x="576" y="96" class="sub">JSON-RPC client of app-server:</text>
  <rect x="576" y="108" width="218" height="30" rx="6" class="box"/>
  <text x="685" y="127" text-anchor="middle" class="sub">editor pane (the "channel")</text>
  <line x1="685" y1="138" x2="685" y2="150" class="edge" marker-end="url(#arr)"/>
  <rect x="576" y="152" width="218" height="30" rx="6" class="box"/>
  <text x="685" y="171" text-anchor="middle" class="sub">extension = JSON-RPC client</text>
  <line x1="685" y1="182" x2="685" y2="194" class="edge" marker-end="url(#arr)"/>
  <rect x="576" y="196" width="218" height="30" rx="6" class="box"/>
  <text x="685" y="215" text-anchor="middle" class="sub">spawns codex app-server · stdio</text>
  <text x="576" y="248" class="sub">Swap "editor pane" for "mailbox /</text>
  <text x="576" y="262" class="sub">Teams chat" and the extension for our</text>
  <text x="576" y="276" class="sub">adapter — the protocol seat, spawn,</text>
  <text x="576" y="290" class="sub">and event handling are identical.</text>
  <text x="576" y="304" class="sub">Read the extension source as the</text>
  <text x="576" y="318" class="sub">reference client implementation.</text>

  <!-- ===== Adapter ===== -->
  <text x="20" y="136" class="tier">ADAPTER · THE JSON-RPC CLIENT (ONE PROCESS WE OWN)</text>
  <rect x="40" y="150" width="490" height="330" rx="8" class="boxOwned"/>

  <!-- ingress row -->
  <rect x="60" y="166" width="210" height="46" rx="6" class="box"/>
  <text x="165" y="184" text-anchor="middle" class="sub">Graph delta poller (outbound pull)</text>
  <text x="165" y="200" text-anchor="middle" class="port">every 15 s · delta token in SQLite</text>
  <rect x="300" y="166" width="210" height="46" rx="6" class="boxFuture"/>
  <text x="405" y="184" text-anchor="middle" class="sub">Teams webhook receiver</text>
  <text x="405" y="200" text-anchor="middle" class="port">needs reachable endpoint</text>
  <line x1="150" y1="100" x2="150" y2="164" class="edge edgeDash" marker-end="url(#arr)"/>
  <line x1="400" y1="100" x2="400" y2="164" class="edge edgeDash" marker-end="url(#arr)"/>

  <!-- normalizer -->
  <line x1="165" y1="212" x2="240" y2="232" class="edge" marker-end="url(#arr)"/>
  <line x1="405" y1="212" x2="330" y2="232" class="edge" marker-end="url(#arr)"/>
  <rect x="60" y="236" width="450" height="40" rx="6" class="box"/>
  <text x="76" y="253" class="label" font-size="12">normalizer → IncomingTurn</text>
  <text x="76" y="268" class="code">{channel, sender, colleague, thread_id, text, attachments[]}</text>

  <!-- router -->
  <line x1="285" y1="276" x2="285" y2="288" class="edge" marker-end="url(#arr)"/>
  <rect x="60" y="292" width="450" height="54" rx="6" class="box"/>
  <text x="76" y="310" class="label" font-size="12">router</text>
  <text x="76" y="325" class="sub">① sender allow-list gate ② +tag → colleague ③ thread_id ↔ conversation_id</text>
  <text x="76" y="339" class="port">SQLite: thread_map · processed · inflight · dead_letter</text>

  <!-- scheduler -->
  <line x1="285" y1="346" x2="285" y2="358" class="edge" marker-end="url(#arr)"/>
  <rect x="60" y="362" width="450" height="40" rx="6" class="box"/>
  <text x="76" y="379" class="label" font-size="12">turn scheduler</text>
  <text x="76" y="394" class="sub">FIFO across threads · strict serial within a thread · max_turns = 2</text>

  <!-- rpc client core -->
  <line x1="285" y1="402" x2="285" y2="414" class="edge" marker-end="url(#arr)"/>
  <rect x="60" y="418" width="450" height="48" rx="6" class="box"/>
  <text x="76" y="436" class="label" font-size="12">JSON-RPC client core</text>
  <text x="76" y="451" class="sub">request/response correlation · event subscriber → trace tap · approval responder · reply relay</text>

  <!-- ===== stdio boundary band ===== -->
  <rect x="40" y="500" width="770" height="64" rx="8" class="band"/>
  <text x="60" y="522" class="label">the boundary: child process + stdio pipes — JSON-RPC 2.0 is the message format, not a server</text>
  <text x="60" y="538" class="sub">adapter spawns `codex app-server` at boot (restart-on-exit) · newline-delimited JSON over stdin/stdout · no port, no HTTP, nothing to “host”</text>
  <text x="60" y="552" class="port">same transport idea as MCP stdio · method names below are representative — pin them to your codex release (ADR-015)</text>

  <!-- message columns crossing the boundary -->
  <line x1="240" y1="466" x2="240" y2="498" class="edge" marker-end="url(#arr)"/>
  <line x1="240" y1="564" x2="240" y2="596" class="edge" marker-end="url(#arr)"/>
  <line x1="620" y1="596" x2="620" y2="568" class="edge" marker-end="url(#arr)"/>
  <line x1="620" y1="496" x2="620" y2="468" class="edge" marker-end="url(#arr)"/>
  <text x="632" y="486" class="edgeLabel" fill="#c2410c">events feed traces/audit.jsonl</text>

  <rect x="60" y="610" width="360" height="118" rx="6" class="box"/>
  <text x="76" y="630" class="label" font-size="12">adapter → app-server (requests ↓)</text>
  <text x="76" y="648" class="code">initialize / initialized        once, on spawn</text>
  <text x="76" y="663" class="code">newConversation(profile)        first mail in thread</text>
  <text x="76" y="678" class="code">sendUserTurn(conv_id, text)     each mail</text>
  <text x="76" y="693" class="code">execCommandApproval(decision)   reply to ← request</text>
  <text x="76" y="708" class="code">interruptConversation(conv_id)  cancel / timeout</text>

  <rect x="440" y="610" width="370" height="118" rx="6" class="box"/>
  <text x="456" y="630" class="label" font-size="12">app-server → adapter (events &amp; callbacks ↑)</text>
  <text x="456" y="648" class="code">notif: agent_message_delta      streaming answer text</text>
  <text x="456" y="663" class="code">notif: exec_command_begin/end   tool activity → trace</text>
  <text x="456" y="678" class="code">notif: turn_complete            final message → relay</text>
  <text x="456" y="693" class="code">notif: token_count              cost metering</text>
  <text x="456" y="708" class="code">req:   execCommandApproval?     only if policy=on-request</text>

  <!-- ===== app-server ===== -->
  <text x="20" y="762" class="tier">CODEX APP-SERVER · OFFICIAL HARNESS, UNMODIFIED · CHILD PROCESS</text>
  <rect x="40" y="776" width="770" height="128" rx="8" class="box"/>
  <rect x="60" y="792" width="230" height="96" rx="8" class="boxAgent"/>
  <text x="76" y="812" class="label">conversation registry</text>
  <text x="76" y="828" class="sub">one per mail thread · in-memory,</text>
  <text x="76" y="842" class="sub">rollout persisted to</text>
  <text x="76" y="856" class="port">~/.codex/sessions/*.jsonl</text>
  <text x="76" y="874" class="port">profile per colleague (AGENTS.md)</text>
  <rect x="310" y="792" width="230" height="96" rx="8" class="box"/>
  <text x="326" y="812" class="label">turn executor</text>
  <text x="326" y="828" class="sub">agent loop · sandbox (workspace-write)</text>
  <text x="326" y="842" class="sub">spawns tool subprocesses (short-lived)</text>
  <text x="326" y="856" class="sub">LLM calls: HTTPS out (only other</text>
  <text x="326" y="870" class="sub">outbound line on the device)</text>
  <rect x="560" y="792" width="230" height="96" rx="8" class="box"/>
  <text x="576" y="812" class="label">MCP client</text>
  <text x="576" y="828" class="sub">stdio children per configured server:</text>
  <text x="576" y="842" class="port">doc_* · kanban_* · memory_*</text>
  <text x="576" y="856" class="port">outlook-mcp (search mail, mid-turn)</text>
  <text x="576" y="874" class="sub">tools = the colleague's hands</text>

  <text x="20" y="930" class="sub">Implementers start here: ① speak the boundary above — spawn + stdio + five requests / five events.</text>
  <text x="20" y="946" class="sub">② Everything inside the bottom box is upstream's problem, not yours.</text>
</svg>
