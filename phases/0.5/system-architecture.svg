<svg viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Phase 0.5 — C2 Container Diagram</title>
  <desc>A C4 Container diagram for the Digital Colleague System, arranged around straight horizontal and vertical relationships. SaaS events move vertically through Event Ingress into the Runtime Controller. Human interaction and agent execution form one horizontal line. State, MCP tools, and secrets sit directly below their owning runtime paths.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <style>
    .title { font-size: 21px; font-weight: 750; fill: #0f172a; }
    .subtitle { font-size: 11px; fill: #64748b; }
    .boundary { fill: #fcfcfd; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .boundaryLabel { font-size: 11px; font-weight: 750; fill: #334155; letter-spacing: .55px; }
    .owned { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
    .runtime { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
    .person { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .external { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    .name { font-size: 13px; font-weight: 750; fill: #0f172a; }
    .type { font-size: 8.5px; font-weight: 750; fill: #64748b; letter-spacing: .55px; }
    .desc { font-size: 10.5px; fill: #475569; }
    .rel { font-size: 9.5px; fill: #475569; font-family: ui-monospace, monospace; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .relIn { font-size: 9.5px; fill: #dc2626; font-family: ui-monospace, monospace; font-weight: 750; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .relOut { font-size: 9.5px; fill: #c2410c; font-family: ui-monospace, monospace; font-weight: 750; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.3; }
    .edgeBlue { fill: none; stroke: #2563eb; stroke-width: 1.5; }
    .edgeIn { fill: none; stroke: #dc2626; stroke-width: 1.7; }
    .edgeOut { fill: none; stroke: #c2410c; stroke-width: 1.6; }
    .legend { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .rule { stroke: #e2e8f0; stroke-width: 1; }
  </style>

  <rect width="1200" height="850" fill="#ffffff"/>

  <text x="28" y="34" class="title">Phase 0.5 · C2 Container Diagram</text>
  <text x="28" y="54" class="subtitle">C4 “container” = an independently running application, service, process, or data store — not necessarily Docker.</text>

  <rect x="500" y="72" width="200" height="82" rx="10" class="external"/>
  <text x="600" y="95" text-anchor="middle" class="type">EXTERNAL SOFTWARE SYSTEMS</text>
  <text x="600" y="119" text-anchor="middle" class="name">SaaS services</text>
  <text x="600" y="140" text-anchor="middle" class="desc">mail · chat · calendar · work systems</text>

  <rect x="220" y="172" width="740" height="600" rx="14" class="boundary"/>
  <text x="244" y="198" class="boundaryLabel">DIGITAL COLLEAGUE SYSTEM · IN SCOPE</text>
  <line x1="244" y1="210" x2="936" y2="210" class="rule"/>

  <rect x="500" y="228" width="200" height="112" rx="9" class="owned"/>
  <text x="600" y="252" text-anchor="middle" class="type">ALWAYS-ON HTTPS SERVICE</text>
  <text x="600" y="278" text-anchor="middle" class="name">Event Ingress</text>
  <text x="600" y="302" text-anchor="middle" class="desc">verify · de-duplicate · normalize</text>
  <text x="600" y="321" text-anchor="middle" class="desc">buffer accepted events</text>

  <rect x="20" y="382" width="174" height="100" rx="10" class="person"/>
  <text x="107" y="407" text-anchor="middle" class="type">PERSON</text>
  <text x="107" y="433" text-anchor="middle" class="name">Person / teammate</text>
  <text x="107" y="456" text-anchor="middle" class="desc">one colleague interface</text>

  <rect x="250" y="374" width="190" height="116" rx="9" class="runtime"/>
  <text x="345" y="398" text-anchor="middle" class="type">WEB / DESKTOP APPLICATION</text>
  <text x="345" y="424" text-anchor="middle" class="name">Interaction Client</text>
  <text x="345" y="448" text-anchor="middle" class="desc">one face-to-face surface</text>
  <text x="345" y="467" text-anchor="middle" class="desc">conversation · review · approval</text>

  <rect x="500" y="364" width="200" height="136" rx="9" class="owned"/>
  <text x="600" y="388" text-anchor="middle" class="type">RUNTIME CONTROL SERVICE</text>
  <text x="600" y="414" text-anchor="middle" class="name">Runtime Controller</text>
  <text x="600" y="438" text-anchor="middle" class="desc">session map · persona loading</text>
  <text x="600" y="457" text-anchor="middle" class="desc">triage · app-server client</text>
  <text x="600" y="476" text-anchor="middle" class="desc">turn policy · audit continuity</text>

  <rect x="760" y="354" width="180" height="156" rx="9" class="runtime"/>
  <text x="850" y="378" text-anchor="middle" class="type">CODEX APP-SERVER PROCESS</text>
  <text x="850" y="404" text-anchor="middle" class="name">Codex app-server</text>
  <text x="850" y="428" text-anchor="middle" class="desc">thread / turn API</text>
  <text x="850" y="447" text-anchor="middle" class="desc">agent loop · approvals</text>
  <text x="850" y="466" text-anchor="middle" class="desc">streamed events</text>
  <text x="850" y="485" text-anchor="middle" class="desc">MCP client host</text>

  <rect x="996" y="382" width="184" height="100" rx="10" class="external"/>
  <text x="1088" y="407" text-anchor="middle" class="type">EXTERNAL SOFTWARE SYSTEM</text>
  <text x="1088" y="433" text-anchor="middle" class="name">LLM platform</text>
  <text x="1088" y="456" text-anchor="middle" class="desc">model inference endpoint</text>

  <rect x="500" y="566" width="200" height="106" rx="9" class="runtime"/>
  <text x="600" y="590" text-anchor="middle" class="type">DATA STORE</text>
  <text x="600" y="616" text-anchor="middle" class="name">Colleague State</text>
  <text x="600" y="640" text-anchor="middle" class="desc">persona · tasks · session map</text>
  <text x="600" y="659" text-anchor="middle" class="desc">audit correlation</text>

  <rect x="760" y="566" width="180" height="106" rx="9" class="owned"/>
  <text x="850" y="590" text-anchor="middle" class="type">MCP SERVER PROCESS(ES)</text>
  <text x="850" y="616" text-anchor="middle" class="name">MCP Tool Servers</text>
  <text x="850" y="640" text-anchor="middle" class="desc">SaaS tool contracts</text>
  <text x="850" y="659" text-anchor="middle" class="relOut">outbound actions</text>

  <rect x="760" y="692" width="180" height="72" rx="9" class="runtime"/>
  <text x="850" y="714" text-anchor="middle" class="type">CREDENTIAL STORE</text>
  <text x="850" y="738" text-anchor="middle" class="name">Secrets Broker</text>
  <text x="850" y="756" text-anchor="middle" class="desc">OAuth tokens · API keys</text>

  <line x1="600" y1="154" x2="600" y2="226" class="edgeIn" marker-end="url(#arrRed)"/>
  <text x="612" y="193" class="relIn">1 · webhook [HTTPS]</text>

  <line x1="600" y1="340" x2="600" y2="362" class="edgeIn" marker-end="url(#arrRed)"/>
  <text x="612" y="355" class="relIn">2 · accepted event</text>

  <line x1="194" y1="432" x2="248" y2="432" class="edgeBlue" marker-end="url(#arrBlue)"/>
  <text x="221" y="420" text-anchor="middle" class="rel">uses UI</text>

  <line x1="440" y1="432" x2="498" y2="432" class="edge" marker-end="url(#arr)"/>
  <text x="469" y="420" text-anchor="middle" class="rel">local API / IPC</text>

  <line x1="700" y1="406" x2="758" y2="406" class="edge" marker-end="url(#arr)"/>
  <line x1="760" y1="458" x2="702" y2="458" class="edge" marker-end="url(#arr)"/>
  <text x="730" y="394" text-anchor="middle" class="rel">3 · JSON-RPC</text>
  <text x="730" y="476" text-anchor="middle" class="rel">events</text>

  <line x1="940" y1="432" x2="994" y2="432" class="edge" marker-end="url(#arr)"/>
  <text x="967" y="420" text-anchor="middle" class="rel">HTTPS inference</text>

  <line x1="600" y1="500" x2="600" y2="564" class="edge" marker-end="url(#arr)"/>
  <text x="612" y="536" class="rel">read / write</text>

  <line x1="850" y1="510" x2="850" y2="564" class="edgeOut" marker-end="url(#arrOrange)"/>
  <text x="862" y="542" class="relOut">4 · MCP</text>

  <line x1="850" y1="672" x2="850" y2="690" class="edge" marker-end="url(#arr)"/>
  <text x="862" y="686" class="rel">scoped credentials</text>

  <path d="M940 619 L970 619 L970 113 L702 113" class="edgeOut" marker-end="url(#arrOrange)"/>
  <text x="806" y="101" class="relOut">5 · SaaS API [HTTPS]</text>

  <rect x="20" y="784" width="1160" height="46" rx="8" class="legend"/>
  <text x="42" y="806" class="relIn">RED = inbound wake-up</text>
  <text x="232" y="806" class="relOut">ORANGE = outbound tool action</text>
  <text x="498" y="806" class="desc">All core relationships are straight; only the outbound SaaS return uses an outer route.</text>
  <text x="42" y="822" class="subtitle">C4 scope is logical runtime structure. Docker, VM, workstation, clustering, and availability belong in the Deployment diagram.</text>
</svg>
