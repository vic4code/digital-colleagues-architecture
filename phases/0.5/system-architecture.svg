<svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Phase 0.5 — system architecture (C4 container / deployment view)</title>
  <desc>What actually runs, where, and over which protocol. An OpenClaw gateway process on a runtime host spawns a Codex app-server child over stdio JSON-RPC, receives service events on a public webhook endpoint, calls out to SaaS APIs and an LLM endpoint over HTTPS, and reads credentials from a secrets broker. Only the webhook receiver is inbound-exposed; everything else is outbound.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <style>
    .h1 { font-size: 15px; font-weight: 700; fill: #111827; }
    .label { font-size: 12px; font-weight: 600; fill: #111827; }
    .sub { font-size: 10.5px; fill: #6b7280; }
    .tech { font-size: 9.5px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .techR { font-size: 9.5px; fill: #dc2626; font-weight: 700; font-family: ui-monospace, monospace; }
    .proto { font-size: 9.5px; fill: #6b7280; font-family: ui-monospace, monospace; }
    .protoR { font-size: 9.5px; fill: #dc2626; font-weight: 700; font-family: ui-monospace, monospace; }
    .bnd { font-size: 10.5px; font-weight: 700; fill: #4b5563; }
    .edge { stroke: #9ca3af; stroke-width: 1.3; fill: none; }
    .edgeR { stroke: #dc2626; stroke-width: 1.5; fill: none; }
    .ext { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.2; }
    .actor { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.4; }
    .own1 { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.4; }
    .exposed { fill: #fff7ed; stroke: #dc2626; stroke-width: 1.6; }
    .grey { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .host { fill: none; stroke: #6b7280; stroke-width: 1.4; stroke-dasharray: 7 4; }
  </style>

  <text x="24" y="26" class="h1">Digital colleague — system architecture (C4 container / deployment view)</text>
  <text x="24" y="44" class="sub">What runs where, over which protocol. Complements the component view in architecture.svg. Orange = we build/configure; grey = off-the-shelf.</text>

  <!-- external systems (top) -->
  <rect x="40" y="60" width="300" height="50" rx="9" class="ext"/>
  <text x="190" y="80" text-anchor="middle" class="label">SaaS services</text>
  <text x="190" y="96" text-anchor="middle" class="sub">Gmail · Graph/Outlook · GCal · Slack — push + REST</text>
  <rect x="560" y="60" width="280" height="50" rx="9" class="ext"/>
  <text x="700" y="80" text-anchor="middle" class="label">LLM endpoint</text>
  <text x="700" y="96" text-anchor="middle" class="sub">Codex / OpenAI (cloud)</text>

  <!-- protocol labels between externals and host -->
  <text x="150" y="132" class="protoR">push sub → HTTPS POST (inbound)</text>
  <text x="360" y="146" class="proto">outbound REST (HTTPS)</text>
  <text x="726" y="140" class="proto">HTTPS (inference)</text>

  <!-- actor -->
  <rect x="24" y="248" width="120" height="56" rx="9" class="actor"/>
  <text x="84" y="270" text-anchor="middle" class="label">Person /</text>
  <text x="84" y="286" text-anchor="middle" class="label">teammate</text>

  <!-- runtime host boundary -->
  <rect x="168" y="158" width="692" height="288" rx="12" class="host"/>
  <text x="184" y="178" class="bnd">RUNTIME HOST · device (dev) / EC2 (prod) — outbound-only except the webhook endpoint</text>

  <!-- webhook receiver (exposed) -->
  <rect x="190" y="194" width="230" height="60" rx="9" class="exposed"/>
  <text x="305" y="214" text-anchor="middle" class="label">Webhook receiver</text>
  <text x="305" y="229" text-anchor="middle" class="sub">verify sig · dedup · triage</text>
  <text x="305" y="244" text-anchor="middle" class="techR">[public HTTPS :443 — only exposed port]</text>

  <!-- interaction surface -->
  <rect x="190" y="272" width="230" height="56" rx="9" class="grey"/>
  <text x="305" y="295" text-anchor="middle" class="label">Interaction surface</text>
  <text x="305" y="311" text-anchor="middle" class="tech">[web / desktop UI]</text>

  <!-- openclaw gateway -->
  <rect x="446" y="206" width="234" height="122" rx="9" class="own1"/>
  <text x="563" y="228" text-anchor="middle" class="label">OpenClaw gateway</text>
  <text x="563" y="243" text-anchor="middle" class="tech">[process]</text>
  <text x="563" y="264" text-anchor="middle" class="sub">channels · webhook routes</text>
  <text x="563" y="280" text-anchor="middle" class="sub">session store · persona loader</text>
  <text x="563" y="296" text-anchor="middle" class="sub">triage rules</text>
  <text x="563" y="315" text-anchor="middle" class="sub">deliver-only / [SILENT]</text>

  <!-- codex app-server -->
  <rect x="704" y="206" width="136" height="122" rx="9" class="grey"/>
  <text x="772" y="228" text-anchor="middle" class="label">Codex</text>
  <text x="772" y="244" text-anchor="middle" class="label">app-server</text>
  <text x="772" y="264" text-anchor="middle" class="tech">[child process]</text>
  <text x="772" y="284" text-anchor="middle" class="sub">agent loop</text>
  <text x="772" y="300" text-anchor="middle" class="sub">sandbox exec</text>

  <!-- secrets broker -->
  <rect x="190" y="366" width="230" height="54" rx="9" class="grey"/>
  <text x="305" y="388" text-anchor="middle" class="label">Secrets broker</text>
  <text x="305" y="404" text-anchor="middle" class="tech">[keychain / secrets mgr]</text>

  <!-- persona + skills -->
  <rect x="446" y="366" width="234" height="54" rx="9" class="own1"/>
  <text x="563" y="388" text-anchor="middle" class="label">Persona + skills</text>
  <text x="563" y="404" text-anchor="middle" class="tech">[config files: SOUL / IDENTITY]</text>

  <!-- connectors -->
  <line x1="144" y1="288" x2="188" y2="294" class="edge" marker-end="url(#arr)"/>
  <text x="150" y="281" class="proto">UI</text>

  <!-- SaaS push -> webhook receiver (INBOUND, exposed) -->
  <line x1="200" y1="110" x2="288" y2="192" class="edgeR" marker-end="url(#arrR)"/>

  <!-- gateway -> SaaS (outbound REST) -->
  <path d="M 470 206 L 320 130 L 300 112" class="edge" fill="none" marker-end="url(#arr)"/>

  <!-- webhook receiver -> gateway -->
  <line x1="420" y1="222" x2="444" y2="244" class="edge" marker-end="url(#arr)"/>
  <!-- interaction surface -> gateway -->
  <line x1="420" y1="298" x2="444" y2="286" class="edge" marker-end="url(#arr)"/>

  <!-- gateway <-> codex stdio -->
  <line x1="680" y1="258" x2="702" y2="258" class="edge" marker-end="url(#arr)"/>
  <line x1="702" y1="274" x2="680" y2="274" class="edge" marker-end="url(#arr)"/>
  <text x="646" y="346" text-anchor="middle" class="proto">stdio JSON-RPC</text>

  <!-- codex -> LLM -->
  <line x1="772" y1="206" x2="716" y2="112" class="edge" marker-end="url(#arr)"/>

  <!-- gateway -> secrets -->
  <line x1="466" y1="328" x2="360" y2="364" class="edge" marker-end="url(#arr)"/>
  <text x="356" y="352" class="proto">fetch tokens</text>
  <!-- gateway -> persona -->
  <line x1="563" y1="328" x2="563" y2="364" class="edge" marker-end="url(#arr)"/>
  <text x="570" y="352" class="proto">load</text>

  <!-- footer -->
  <text x="24" y="474" class="sub">Only the webhook receiver is inbound-exposed (public HTTPS). Everything else is outbound. Dev: a tunnel (ngrok / cloudflared); prod: an always-on EC2.</text>
  <text x="24" y="492" class="sub">Container / deployment altitude (C4 level 2). architecture.svg is the component altitude (level 3); integration-flow.svg is the inbound sequence.</text>
</svg>
