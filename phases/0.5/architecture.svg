<svg viewBox="0 0 900 810" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Phase 0.5 — one digital colleague, humanized: persona at the center, tools on the ring</title>
  <desc>One digital colleague sits at the center as a layered persona on a local runtime and Codex engine. A person meets it through one face-to-face interaction surface at the top. Around it, prominent tool cards — Gmail, Outlook, Calendar, Teams, Slack, Notion, Browser, Database, internal systems — are bidirectional, event-driven integrations. Access, permission, and audit bound every connection. Peer colleagues are drawn side by side later; this is one colleague.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <style>
    .h1 { font-size: 15px; font-weight: 700; fill: #111827; }
    .name { font-size: 16px; font-weight: 700; fill: #7c2d12; }
    .label { font-size: 12px; font-weight: 600; fill: #111827; }
    .sub { font-size: 10.5px; fill: #6b7280; }
    .port { font-size: 10px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .tier { font-size: 11px; font-weight: 700; fill: #4b5563; letter-spacing: 0.4px; }
    .chip { font-size: 9.5px; font-weight: 600; fill: #c2410c; }
    .ok { font-size: 9.5px; fill: #16a34a; font-weight: 600; }
    .spoke { stroke: #cbd5e1; stroke-width: 1.4; fill: none; }
    .toolcard { fill: #ffffff; stroke: #fdba74; stroke-width: 1.3; }
    .icon { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
    .hero { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
    .human { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.6; }
    .sec { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.4; }
    .chipbox { fill: #ffffff; stroke: #fdba74; stroke-width: 0.9; }
    .dot { fill: #16a34a; }
  </style>

  <text x="24" y="30" class="h1">Digital colleague — one colleague, humanized view</text>
  <text x="24" y="48" class="sub">Persona at the center · one human surface (top) · tools on the ring are bidirectional &amp; event-driven · peers side-by-side later.</text>

  <!-- spokes (drawn first, behind cards) -->
  <line x1="450" y1="400" x2="563" y2="171" class="spoke"/>
  <line x1="450" y1="400" x2="736" y2="281" class="spoke"/>
  <line x1="450" y1="400" x2="775" y2="443" class="spoke"/>
  <line x1="450" y1="400" x2="662" y2="585" class="spoke"/>
  <line x1="450" y1="400" x2="450" y2="644" class="spoke"/>
  <line x1="450" y1="400" x2="238" y2="585" class="spoke"/>
  <line x1="450" y1="400" x2="125" y2="443" class="spoke"/>
  <line x1="450" y1="400" x2="164" y2="281" class="spoke"/>
  <line x1="450" y1="400" x2="337" y2="171" class="spoke"/>

  <!-- human face-to-face surface (top) -->
  <line x1="450" y1="120" x2="450" y2="326" class="spoke" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="300" y="66" width="300" height="52" rx="10" class="human"/>
  <text x="450" y="88" text-anchor="middle" class="label">You / teammate · ONE INTERACTION SURFACE</text>
  <text x="450" y="104" text-anchor="middle" class="sub">face-to-face — web / desktop / embodied UI (the only human channel)</text>

  <!-- tool cards on the ring -->
  <!-- Gmail 70 -->
  <rect x="491" y="145" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="501" y="157" width="26" height="26" rx="6" class="icon"/>
  <text x="537" y="169" class="label">Gmail</text>
  <text x="537" y="183" class="sub">mail &amp; threads</text>
  <circle cx="537" cy="189" r="0"/>
  <!-- Teams 110 -->
  <rect x="262" y="145" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="272" y="157" width="26" height="26" rx="6" class="icon"/>
  <text x="308" y="169" class="label">MS Teams</text>
  <text x="308" y="183" class="sub">chats &amp; meetings</text>
  <!-- Outlook 30 -->
  <rect x="661" y="255" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="671" y="267" width="26" height="26" rx="6" class="icon"/>
  <text x="707" y="279" class="label">Outlook</text>
  <text x="707" y="293" class="sub">mail &amp; calendar</text>
  <!-- Slack 150 -->
  <rect x="89" y="255" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="99" y="267" width="26" height="26" rx="6" class="icon"/>
  <text x="135" y="279" class="label">Slack</text>
  <text x="135" y="293" class="sub">channels &amp; DMs</text>
  <!-- Calendar -10 -->
  <rect x="700" y="417" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="710" y="429" width="26" height="26" rx="6" class="icon"/>
  <text x="746" y="441" class="label">Calendar</text>
  <text x="746" y="455" class="sub">events &amp; schedule</text>
  <!-- Browser -170 -->
  <rect x="50" y="417" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="60" y="429" width="26" height="26" rx="6" class="icon"/>
  <text x="96" y="441" class="label">Browser</text>
  <text x="96" y="455" class="sub">web &amp; research</text>
  <!-- Database -50 -->
  <rect x="587" y="565" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="597" y="577" width="26" height="26" rx="6" class="icon"/>
  <text x="633" y="589" class="label">Database</text>
  <text x="633" y="603" class="sub">data &amp; analytics</text>
  <!-- Notion -130 -->
  <rect x="163" y="565" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="173" y="577" width="26" height="26" rx="6" class="icon"/>
  <text x="209" y="589" class="label">Notion</text>
  <text x="209" y="603" class="sub">docs &amp; knowledge</text>
  <!-- Internal systems -90 bottom -->
  <rect x="375" y="618" width="150" height="52" rx="9" class="toolcard"/>
  <rect x="385" y="630" width="26" height="26" rx="6" class="icon"/>
  <text x="421" y="642" class="label">Internal systems</text>
  <text x="421" y="656" class="sub">APIs &amp; services</text>

  <!-- central colleague (drawn last, covers spoke ends) -->
  <rect x="336" y="326" width="228" height="150" rx="14" class="hero"/>
  <circle cx="450" cy="356" r="13" fill="#f97316"/>
  <path d="M 432 380 Q 450 366 468 380 L 468 384 L 432 384 Z" fill="#f97316"/>
  <text x="450" y="404" text-anchor="middle" class="name">Avery</text>
  <text x="450" y="419" text-anchor="middle" class="ok">● Online · Listening</text>
  <rect x="348" y="428" width="88" height="16" rx="8" class="chipbox"/>
  <text x="392" y="440" text-anchor="middle" class="chip">Soul · Body</text>
  <rect x="440" y="428" width="106" height="16" rx="8" class="chipbox"/>
  <text x="493" y="440" text-anchor="middle" class="chip">Faculty · Skills</text>
  <rect x="348" y="450" width="90" height="16" rx="8" class="chipbox"/>
  <text x="393" y="462" text-anchor="middle" class="chip">Local runtime</text>
  <rect x="442" y="450" width="104" height="16" rx="8" class="chipbox"/>
  <text x="494" y="462" text-anchor="middle" class="chip">Codex engine</text>

  <!-- ring caption -->
  <text x="450" y="700" text-anchor="middle" class="sub">Every spoke is a permission-scoped, bidirectional tool. Inbound is event-driven (push / webhook → triage → act or [SILENT]) — see integration-flow.svg + ADR-020.</text>

  <!-- access & permissions footer -->
  <rect x="24" y="716" width="852" height="72" rx="10" class="sec"/>
  <text x="40" y="736" class="tier">ACCESS &amp; PERMISSIONS · CROSS-CUTTING — every connection above is inside this boundary</text>
  <rect x="40" y="746" width="196" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="138" y="766" text-anchor="middle" class="sub">credential custody · least privilege</text>
  <rect x="244" y="746" width="196" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="342" y="766" text-anchor="middle" class="sub">approval bounds on side effects</text>
  <rect x="448" y="746" width="200" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="548" y="766" text-anchor="middle" class="sub">inbound content is untrusted input</text>
  <rect x="656" y="746" width="204" height="32" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="758" y="766" text-anchor="middle" class="sub">audit: event → task → action</text>
</svg>
