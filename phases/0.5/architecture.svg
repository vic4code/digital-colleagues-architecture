<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Phase 0.5 — C1 System Context</title>
  <desc>A C4 System Context diagram. A person uses one interaction surface to work with the Digital Colleague System. External SaaS systems publish events to it and receive approved actions from it. The system requests reasoning from an LLM platform and may delegate to a peer colleague system.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .name { font-size: 14px; font-weight: 700; fill: #111827; }
    .type { font-size: 10px; font-weight: 700; fill: #6b7280; letter-spacing: .4px; }
    .desc { font-size: 11px; fill: #4b5563; }
    .rel { font-size: 10px; fill: #4b5563; font-family: ui-monospace, monospace; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .person { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .system { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
    .external { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.2; }
    .edge { fill: none; stroke: #6b7280; stroke-width: 1.3; }
    .edgeBlue { fill: none; stroke: #2563eb; stroke-width: 1.4; }
    .edgeOrange { fill: none; stroke: #c2410c; stroke-width: 1.4; }
    .legend { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
  </style>

  <rect width="900" height="620" fill="#ffffff"/>

  <text x="24" y="34" class="title">Phase 0.5 · C1 System Context</text>
  <text x="24" y="54" class="subtitle">Scope: one Digital Colleague System · Audience: everyone · Technology details intentionally omitted</text>

  <rect x="40" y="230" width="210" height="118" rx="10" class="person"/>
  <text x="145" y="258" text-anchor="middle" class="type">PERSON</text>
  <text x="145" y="284" text-anchor="middle" class="name">Person / teammate</text>
  <text x="145" y="307" text-anchor="middle" class="desc">Talks to one persistent colleague</text>
  <text x="145" y="325" text-anchor="middle" class="desc">through one approved interface</text>

  <rect x="330" y="176" width="330" height="220" rx="14" class="system"/>
  <text x="495" y="210" text-anchor="middle" class="type">SOFTWARE SYSTEM · IN SCOPE</text>
  <text x="495" y="240" text-anchor="middle" class="name">Digital Colleague System</text>
  <text x="495" y="270" text-anchor="middle" class="desc">Maintains persona, memory, skills, permissions,</text>
  <text x="495" y="289" text-anchor="middle" class="desc">and task continuity across human and service events.</text>
  <text x="495" y="321" text-anchor="middle" class="desc">Reasons about work and performs approved actions</text>
  <text x="495" y="340" text-anchor="middle" class="desc">through external service integrations.</text>
  <text x="495" y="371" text-anchor="middle" class="type">ONE HUMAN SURFACE · MANY SERVICE TOOLS</text>

  <rect x="710" y="86" width="166" height="104" rx="10" class="external"/>
  <text x="793" y="112" text-anchor="middle" class="type">EXTERNAL SYSTEMS</text>
  <text x="793" y="136" text-anchor="middle" class="name">SaaS services</text>
  <text x="793" y="157" text-anchor="middle" class="desc">Mail · chat · calendar</text>
  <text x="793" y="175" text-anchor="middle" class="desc">work systems · documents</text>

  <rect x="710" y="244" width="166" height="96" rx="10" class="external"/>
  <text x="793" y="270" text-anchor="middle" class="type">EXTERNAL SYSTEM</text>
  <text x="793" y="294" text-anchor="middle" class="name">Peer colleague</text>
  <text x="793" y="317" text-anchor="middle" class="desc">Delegation and hand-off</text>

  <rect x="710" y="406" width="166" height="96" rx="10" class="external"/>
  <text x="793" y="432" text-anchor="middle" class="type">EXTERNAL SYSTEM</text>
  <text x="793" y="456" text-anchor="middle" class="name">LLM platform</text>
  <text x="793" y="479" text-anchor="middle" class="desc">Reasoning and generation</text>

  <line x1="250" y1="288" x2="328" y2="288" class="edgeBlue" marker-end="url(#arrBlue)"/>
  <text x="289" y="277" text-anchor="middle" class="rel">uses one interface</text>

  <path d="M710 126 C690 126 681 207 661 220" class="edge" marker-end="url(#arr)"/>
  <text x="675" y="150" text-anchor="middle" class="rel">publishes events</text>
  <path d="M660 254 C682 239 690 165 710 158" class="edgeOrange" marker-end="url(#arrOrange)"/>
  <text x="679" y="213" text-anchor="middle" class="rel">reads / acts</text>

  <line x1="660" y1="292" x2="708" y2="292" class="edgeOrange" marker-end="url(#arrOrange)"/>
  <line x1="708" y1="310" x2="660" y2="310" class="edge" marker-end="url(#arr)"/>
  <text x="684" y="280" text-anchor="middle" class="rel">delegates</text>

  <path d="M660 354 C684 373 688 452 708 452" class="edge" marker-end="url(#arr)"/>
  <text x="684" y="404" text-anchor="middle" class="rel">requests reasoning</text>

  <rect x="40" y="544" width="836" height="48" rx="8" class="legend"/>
  <rect x="58" y="558" width="30" height="20" rx="4" class="person"/><text x="98" y="573" class="desc">Person</text>
  <rect x="180" y="558" width="30" height="20" rx="4" class="system"/><text x="220" y="573" class="desc">System in scope</text>
  <rect x="356" y="558" width="30" height="20" rx="4" class="external"/><text x="396" y="573" class="desc">External system</text>
  <text x="548" y="573" class="desc">Arrows state intent, not protocol · Zoom to C2 for technology</text>
</svg>
