<svg viewBox="0 0 780 840" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Phase 0.5 — one interaction surface with bidirectional service tools</title>
  <desc>A person meets one digital colleague through one consistent face-to-face interface. The colleague is a layered persona on an agent runtime and Codex engine. Outlook, Gmail, Slack, calendars, Notion, and kanban are bidirectional tools: events flow in and actions flow out. Access, permissions, approvals, and audit bound every service interaction.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <style>
    .label { font-size: 12px; font-weight: 500; fill: #111827; }
    .sub { font-size: 11px; fill: #6b7280; }
    .port { font-size: 10px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .tier { font-size: 11px; font-weight: 700; fill: #4b5563; letter-spacing: 0.5px; }
    .own { font-size: 9px; font-weight: 700; fill: #c2410c; font-family: ui-monospace, monospace; }
    .sec { font-size: 9px; font-weight: 700; fill: #1d4ed8; font-family: ui-monospace, monospace; }
    .edge { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
    .edgeTool { stroke: #c2410c; stroke-width: 1.3; fill: none; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .boxOff { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; }
    .boxOwn { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.4; }
    .boxSec { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.4; }
    .chip { fill: #fff7ed; stroke: #fdba74; stroke-width: 0.8; }
    .chipSec { fill: #eff6ff; stroke: #93c5fd; stroke-width: 0.8; }
    .service { fill: #ffffff; stroke: #fdba74; stroke-width: 1; }
  </style>

  <text x="20" y="24" class="sub">One relationship, one interface. Surrounding services are the colleague's tools — events in, actions out.</text>

  <!-- Human and the single interaction surface -->
  <text x="20" y="52" class="tier">FACE-TO-FACE · THE ONLY HUMAN-FACING CHANNEL</text>
  <rect x="24" y="64" width="732" height="82" rx="10" class="boxOff"/>
  <rect x="48" y="82" width="170" height="46" rx="8" class="box"/>
  <text x="133" y="102" text-anchor="middle" class="label">You / teammate</text>
  <text x="133" y="117" text-anchor="middle" class="sub">one person, one intent</text>
  <line x1="218" y1="105" x2="300" y2="105" class="edge" marker-end="url(#arr)"/>
  <rect x="300" y="78" width="432" height="54" rx="8" class="box"/>
  <text x="516" y="99" text-anchor="middle" class="label">ONE INTERACTION SURFACE</text>
  <text x="516" y="116" text-anchor="middle" class="sub">web / desktop / embodied UI — one approved binding per deployment</text>

  <line x1="390" y1="146" x2="390" y2="174" class="edge" marker-end="url(#arr)"/>

  <!-- Digital colleague -->
  <text x="20" y="196" class="tier">THE DIGITAL COLLEAGUE · PERSONA + SKILLS + RUNTIME</text>
  <rect x="24" y="208" width="732" height="222" rx="10" class="boxOwn"/>
  <rect x="38" y="220" width="66" height="14" rx="7" class="chip"/>
  <text x="46" y="230" class="own">WE AUTHOR</text>

  <rect x="48" y="248" width="160" height="48" rx="6" class="boxOwn"/>
  <text x="128" y="267" text-anchor="middle" class="label">Soul</text>
  <text x="128" y="283" text-anchor="middle" class="sub">values · voice · purpose</text>
  <rect x="222" y="248" width="160" height="48" rx="6" class="boxOwn"/>
  <text x="302" y="267" text-anchor="middle" class="label">Body</text>
  <text x="302" y="283" text-anchor="middle" class="sub">identity · presence</text>
  <rect x="396" y="248" width="160" height="48" rx="6" class="boxOwn"/>
  <text x="476" y="267" text-anchor="middle" class="label">Faculty</text>
  <text x="476" y="283" text-anchor="middle" class="sub">reasoning · memory policy</text>
  <rect x="570" y="248" width="162" height="48" rx="6" class="boxOwn"/>
  <text x="651" y="267" text-anchor="middle" class="label">Skills</text>
  <text x="651" y="283" text-anchor="middle" class="sub">decide what tool to use</text>

  <rect x="48" y="312" width="684" height="44" rx="6" class="box"/>
  <text x="60" y="330" class="label">Agent runtime</text>
  <text x="60" y="346" class="sub">session · approval · transcript · persona loading · durable event-to-task continuity</text>
  <rect x="48" y="370" width="684" height="44" rx="6" class="boxOff"/>
  <text x="60" y="388" class="label">Codex engine</text>
  <text x="60" y="404" class="sub">agent loop · thread resume · tool continuation · compaction · sandbox execution</text>

  <line x1="390" y1="430" x2="390" y2="466" class="edgeTool" marker-end="url(#arrOrange)"/>
  <line x1="414" y1="466" x2="414" y2="430" class="edgeTool" marker-end="url(#arrOrange)"/>
  <text x="428" y="453" class="port">events in · actions out</text>

  <!-- Tool/service boundary -->
  <text x="20" y="490" class="tier">BIDIRECTIONAL INTEGRATIONS / TOOLS · THE COLLEAGUE CONNECTS AND ACTS</text>
  <rect x="24" y="502" width="732" height="146" rx="10" class="boxOff"/>
  <rect x="42" y="516" width="696" height="34" rx="6" class="box"/>
  <text x="390" y="531" text-anchor="middle" class="label">Integration tool boundary</text>
  <text x="390" y="545" text-anchor="middle" class="sub">normalize event · expose actions · preserve provenance · correlate audit</text>

  <rect x="42" y="566" width="126" height="54" rx="7" class="service"/>
  <text x="105" y="587" text-anchor="middle" class="label">Outlook</text>
  <text x="105" y="604" text-anchor="middle" class="sub">mail · calendar</text>
  <rect x="180" y="566" width="126" height="54" rx="7" class="service"/>
  <text x="243" y="587" text-anchor="middle" class="label">Gmail</text>
  <text x="243" y="604" text-anchor="middle" class="sub">receive · send</text>
  <rect x="318" y="566" width="126" height="54" rx="7" class="service"/>
  <text x="381" y="587" text-anchor="middle" class="label">Slack</text>
  <text x="381" y="604" text-anchor="middle" class="sub">events · replies</text>
  <rect x="456" y="566" width="126" height="54" rx="7" class="service"/>
  <text x="519" y="587" text-anchor="middle" class="label">Notion</text>
  <text x="519" y="604" text-anchor="middle" class="sub">read · update</text>
  <rect x="594" y="566" width="144" height="54" rx="7" class="service"/>
  <text x="666" y="587" text-anchor="middle" class="label">Kanban · APIs · …</text>
  <text x="666" y="604" text-anchor="middle" class="sub">trigger · act · report</text>

  <!-- Access and permission surface -->
  <text x="20" y="674" class="tier">ACCESS &amp; PERMISSIONS · CROSS-CUTTING SECURITY BOUNDARY</text>
  <rect x="24" y="686" width="732" height="112" rx="10" class="boxSec"/>
  <rect x="38" y="698" width="150" height="14" rx="7" class="chipSec"/>
  <text x="46" y="708" class="sec">WE DESIGN · REVIEWED</text>

  <rect x="42" y="726" width="162" height="48" rx="6" class="box"/>
  <text x="54" y="744" class="label">Credential custody</text>
  <text x="54" y="760" class="sub">tokens stay in a broker/store</text>
  <rect x="216" y="726" width="162" height="48" rx="6" class="box"/>
  <text x="228" y="744" class="label">Least privilege</text>
  <text x="228" y="760" class="sub">read/write scope per tool</text>
  <rect x="390" y="726" width="162" height="48" rx="6" class="box"/>
  <text x="402" y="744" class="label">Approval bounds</text>
  <text x="402" y="760" class="sub">human gates side effects</text>
  <rect x="564" y="726" width="174" height="48" rx="6" class="box"/>
  <text x="576" y="744" class="label">Audit + provenance</text>
  <text x="576" y="760" class="sub">event → task → action</text>

  <text x="20" y="824" class="sub">ADR-019: a new service adds a capability, not a new conversation surface or a new colleague identity.</text>
</svg>
