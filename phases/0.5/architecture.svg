<svg viewBox="0 0 840 760" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Phase 0.5 codex-native edge prototype architecture</title>
  <desc>Outlook (and later Teams) channels feeding a thin channel adapter, which drives an unmodified codex app-server runtime on the user's device. Two-layer interaction traces: adapter audit stream plus codex session rollouts, synced to a shared store.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <style>
    .label { font-size: 13px; font-weight: 500; fill: #111827; }
    .sub { font-size: 11px; fill: #6b7280; }
    .port { font-size: 10px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .tier { font-size: 11px; font-weight: 500; fill: #6b7280; letter-spacing: 0.5px; text-transform: uppercase; }
    .edge { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
    .edgeAccent { stroke: #c2410c; stroke-width: 1.3; fill: none; }
    .edgeDash { stroke-dasharray: 4 3; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .boxFuture { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4 3; }
    .boxAgent { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
    .boxOwned { fill: #ffffff; stroke: #6b7280; stroke-width: 1.4; }
    .boxShared { fill: #f9fafb; stroke: #d1d5db; stroke-dasharray: 4 3; stroke-width: 1; }
    .boxDevice { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .boxCloud { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; }
    .pill { fill: #f3f4f6; stroke: #e5e7eb; stroke-width: 1; }
    .edgeLabel { font-size: 10px; fill: #6b7280; font-family: ui-monospace, monospace; }
  </style>

  <!-- Tier 1: channels -->
  <text x="20" y="28" class="tier">CHANNELS · MICROSOFT 365</text>

  <rect x="40" y="44" width="220" height="60" rx="30" class="boxCloud"/>
  <text x="150" y="68" text-anchor="middle" class="label">Outlook / Exchange Online</text>
  <text x="150" y="84" text-anchor="middle" class="sub">per-colleague mailbox (ADR-010)</text>
  <text x="150" y="98" text-anchor="middle" class="port">graph.microsoft.com</text>

  <rect x="300" y="44" width="200" height="60" rx="30" class="boxFuture"/>
  <text x="400" y="68" text-anchor="middle" class="label">Microsoft Teams</text>
  <text x="400" y="84" text-anchor="middle" class="sub">v0.3 — needs resident box</text>
  <text x="400" y="98" text-anchor="middle" class="port">Azure Bot webhook</text>

  <rect x="540" y="44" width="260" height="60" rx="8" class="box"/>
  <text x="670" y="68" text-anchor="middle" class="label">Users</text>
  <text x="670" y="84" text-anchor="middle" class="sub">send mail / @mention · install nothing</text>
  <line x1="540" y1="74" x2="502" y2="74" class="edge edgeDash" marker-end="url(#arr)"/>
  <line x1="540" y1="66" x2="262" y2="66" class="edge" marker-end="url(#arr)"/>

  <!-- Device boundary -->
  <rect x="24" y="140" width="792" height="436" rx="12" class="boxDevice"/>
  <text x="40" y="162" class="tier">EDGE DEVICE · macOS (launchd) / Windows (Task Scheduler) · no inbound port</text>

  <!-- Channel adapter (owned) -->
  <rect x="40" y="180" width="760" height="96" rx="8" class="boxOwned"/>
  <text x="60" y="204" class="label">Channel adapter — the ONLY owned component</text>
  <rect x="60" y="216" width="160" height="26" rx="13" class="pill"/>
  <text x="140" y="233" text-anchor="middle" class="sub">Graph delta polling</text>
  <rect x="230" y="216" width="180" height="26" rx="13" class="pill"/>
  <text x="320" y="233" text-anchor="middle" class="sub">mailbox → colleague routing</text>
  <rect x="420" y="216" width="130" height="26" rx="13" class="pill"/>
  <text x="485" y="233" text-anchor="middle" class="sub">reply relay</text>
  <rect x="560" y="216" width="220" height="26" rx="13" class="pill"/>
  <text x="670" y="233" text-anchor="middle" class="sub">event-stream tap → audit trace</text>
  <text x="60" y="262" class="sub">Outbound-only HTTPS to Graph · JSON-RPC client of the harness · placement-agnostic (edge → resident box → cloud)</text>

  <line x1="150" y1="104" x2="150" y2="178" class="edge" marker-end="url(#arr)"/>
  <text x="158" y="134" class="edgeLabel">HTTPS poll (outbound only)</text>

  <!-- codex app-server (official) -->
  <text x="40" y="304" class="tier">AGENT RUNTIME · OFFICIAL CODEX HARNESS, UNMODIFIED</text>
  <rect x="40" y="318" width="500" height="220" rx="8" class="box"/>
  <text x="60" y="342" class="label">codex app-server</text>
  <text x="60" y="356" class="sub">one process · JSON-RPC · sessions, sandbox, tools, sub-agents all native</text>

  <rect x="60" y="370" width="220" height="76" rx="8" class="boxAgent"/>
  <text x="76" y="390" class="label">Vanessa · PM</text>
  <text x="76" y="404" class="sub">session per thread</text>
  <text x="76" y="420" class="port">personas/vanessa/AGENTS.md</text>
  <text x="76" y="434" class="port">config.toml profile + MCP allow-list</text>

  <rect x="300" y="370" width="220" height="76" rx="8" class="boxAgent"/>
  <text x="316" y="390" class="label">David · SA</text>
  <text x="316" y="404" class="sub">session per thread</text>
  <text x="316" y="420" class="port">personas/david/AGENTS.md</text>
  <text x="316" y="434" class="port">config.toml profile + MCP allow-list</text>

  <path d="M 280 408 L 298 408" class="edgeAccent" marker-end="url(#arrAccent)"/>
  <text x="290" y="462" text-anchor="middle" class="edgeLabel" fill="#c2410c">native sub-agent spawn (co-work, same device)</text>

  <rect x="60" y="476" width="460" height="46" rx="6" class="box"/>
  <text x="76" y="496" class="label">MCP servers</text>
  <text x="76" y="510" class="sub">doc_* · kanban_* · memory_* — same tool interface as Phase 0 / Phase 1</text>

  <line x1="290" y1="276" x2="290" y2="316" class="edge" marker-end="url(#arr)"/>
  <text x="298" y="300" class="edgeLabel">JSON-RPC: newConversation / sendUserTurn ↓ · event stream ↑</text>

  <!-- Traces side panel -->
  <text x="570" y="304" class="tier">INTERACTION TRACES</text>
  <rect x="570" y="318" width="230" height="220" rx="8" class="boxShared"/>
  <text x="586" y="342" class="label">Two layers, one correlation id</text>
  <rect x="586" y="354" width="198" height="52" rx="6" class="box"/>
  <text x="594" y="372" class="label" font-size="12">traces/audit.jsonl</text>
  <text x="594" y="386" class="sub">business audit — adapter-written</text>
  <text x="594" y="399" class="port">who · channel · colleague · tools</text>
  <rect x="586" y="414" width="198" height="52" rx="6" class="box"/>
  <text x="594" y="432" class="label" font-size="12">~/.codex/sessions/*.jsonl</text>
  <text x="594" y="446" class="sub">harness rollout — codex-written</text>
  <text x="594" y="459" class="port">full reasoning + tool I/O</text>
  <text x="586" y="486" class="sub">channel msg id ↔ session id</text>
  <text x="586" y="500" class="sub">sub-agent spawns appear in the</text>
  <text x="586" y="513" class="sub">parent rollout → A→B is one trace</text>

  <path d="M 780 276 Q 800 300 700 352" class="edgeAccent edgeDash" fill="none" marker-end="url(#arrAccent)"/>
  <path d="M 540 440 L 584 440" class="edge edgeDash" marker-end="url(#arr)"/>

  <!-- LLM endpoint -->
  <rect x="40" y="600" width="500" height="56 " rx="8" class="box"/>
  <text x="60" y="622" class="label">LLM endpoint — config, not code</text>
  <text x="60" y="638" class="sub">cloud API · Azure OpenAI · internal vLLM (air-gapped bundle)</text>
  <line x1="290" y1="538" x2="290" y2="598" class="edge edgeDash" marker-end="url(#arr)"/>
  <text x="298" y="572" class="edgeLabel">HTTPS (outbound)</text>

  <!-- Shared trace sink -->
  <rect x="570" y="600" width="230" height="56" rx="8" class="boxCloud"/>
  <text x="685" y="622" text-anchor="middle" class="label">Shared trace store</text>
  <text x="685" y="638" text-anchor="middle" class="sub">SharePoint / S3 — nightly sync → Phase 1 audit</text>
  <line x1="685" y1="576" x2="685" y2="598" class="edge edgeDash" marker-end="url(#arr)"/>

  <text x="20" y="692" class="tier">KEY FLOWS</text>
  <text x="20" y="710" class="sub">① Mail to vanessa@… → adapter poll → route → sendUserTurn → Vanessa session ② Vanessa spawns David natively for the SA sub-task</text>
  <text x="20" y="726" class="sub">③ Reply relayed back via Graph sendMail ④ Adapter taps every harness event into audit.jsonl; codex keeps the full rollout; nightly sync ships both</text>
  <text x="20" y="748" class="sub">Cross-device co-work: colleague A emails colleague B's mailbox — same audited path as humans, no laptop-to-laptop mesh.</text>
</svg>
