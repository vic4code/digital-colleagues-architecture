<svg viewBox="0 0 840 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Phase 0.5 personal mode — one message, end to end</title>
  <desc>Swimlane flow: a mail sent from any device lands in the Exchange Online mailbox (cloud), the edge laptop polls it outbound, runs the codex turn locally, and mails the reply back. The mail service lives in Microsoft 365, not on the device.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <style>
    .label { font-size: 13px; font-weight: 500; fill: #111827; }
    .sub { font-size: 11px; fill: #6b7280; }
    .port { font-size: 10px; fill: #9ca3af; font-family: ui-monospace, monospace; }
    .tier { font-size: 11px; font-weight: 500; fill: #6b7280; letter-spacing: 0.5px; text-transform: uppercase; }
    .edge { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
    .edgeAccent { stroke: #c2410c; stroke-width: 1.3; fill: none; }
    .edgeDash { stroke-dasharray: 4 3; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .boxAgent { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
    .boxShared { fill: #f9fafb; stroke: #d1d5db; stroke-dasharray: 4 3; stroke-width: 1; }
    .boxLane { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1; }
    .boxDevice { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .pill { fill: #f3f4f6; stroke: #e5e7eb; stroke-width: 1; }
    .edgeLabel { font-size: 10px; fill: #6b7280; font-family: ui-monospace, monospace; }
    .step { font-size: 11px; font-weight: 600; fill: #ffffff; }
    .stepDot { fill: #6b7280; }
    .stepDotAccent { fill: #c2410c; }
  </style>

  <!-- ===== Lane A: user, any device ===== -->
  <text x="20" y="30" class="tier">YOU · FROM ANY DEVICE (PHONE, WEB, LAPTOP MAIL APP)</text>
  <rect x="40" y="42" width="240" height="54" rx="8" class="box"/>
  <text x="160" y="64" text-anchor="middle" class="label">New mail</text>
  <text x="160" y="80" text-anchor="middle" class="port">to: me+vanessa@company.com</text>

  <rect x="560" y="42" width="240" height="54" rx="8" class="box"/>
  <text x="680" y="64" text-anchor="middle" class="label">Reply in your inbox</text>
  <text x="680" y="80" text-anchor="middle" class="port">from: me@ · same thread</text>

  <!-- ===== Lane B: Microsoft 365 cloud ===== -->
  <rect x="24" y="130" width="792" height="96" rx="10" class="boxLane"/>
  <text x="40" y="152" class="tier">MICROSOFT 365 CLOUD — THE MAIL SERVICE LIVES HERE, NOT ON YOUR LAPTOP</text>
  <rect x="40" y="162" width="400" height="52" rx="8" class="box"/>
  <text x="60" y="184" class="label">Exchange Online · your mailbox</text>
  <text x="60" y="200" class="sub">stores every message · we implement no mail server</text>
  <rect x="460" y="162" width="160" height="52" rx="8" class="pill"/>
  <text x="540" y="184" text-anchor="middle" class="sub">Inbox</text>
  <text x="540" y="200" text-anchor="middle" class="sub">Processed folder</text>
  <rect x="640" y="162" width="160" height="52" rx="8" class="pill"/>
  <text x="720" y="184" text-anchor="middle" class="sub">Graph REST API</text>
  <text x="720" y="200" text-anchor="middle" class="port">delta · sendMail</text>

  <!-- step 1: send -->
  <line x1="160" y1="96" x2="160" y2="160" class="edge" marker-end="url(#arr)"/>
  <circle cx="146" cy="118" r="9" class="stepDot"/><text x="146" y="122" text-anchor="middle" class="step">1</text>

  <!-- step 8: reply delivered -->
  <line x1="680" y1="128" x2="680" y2="98" class="edge" marker-end="url(#arr)"/>
  <circle cx="694" cy="116" r="9" class="stepDot"/><text x="694" y="120" text-anchor="middle" class="step">8</text>

  <!-- ===== Lane C: edge device ===== -->
  <rect x="24" y="286" width="792" height="292" rx="12" class="boxDevice"/>
  <text x="40" y="308" class="tier">YOUR LAPTOP · ALL ARROWS TO THE CLOUD START HERE (OUTBOUND) · NO INBOUND PORT</text>

  <!-- step 2: poll up / new msg down -->
  <line x1="240" y1="330" x2="240" y2="228" class="edge edgeDash" marker-end="url(#arr)"/>
  <circle cx="226" cy="278" r="9" class="stepDot"/><text x="226" y="282" text-anchor="middle" class="step">2</text>
  <text x="252" y="246" class="edgeLabel">GET …/inbox/messages/delta</text>
  <text x="252" y="260" class="edgeLabel">every 15 s · laptop dials out;</text>
  <text x="252" y="274" class="edgeLabel">new messages ride the response</text>

  <!-- step 7: sendMail up -->
  <line x1="720" y1="330" x2="720" y2="228" class="edge edgeDash" marker-end="url(#arr)"/>
  <circle cx="734" cy="278" r="9" class="stepDot"/><text x="734" y="282" text-anchor="middle" class="step">7</text>
  <text x="600" y="246" class="edgeLabel">POST /me/sendMail</text>
  <text x="600" y="260" class="edgeLabel">+ move msg to Processed</text>

  <!-- adapter pipeline -->
  <rect x="40" y="330" width="760" height="88" rx="8" class="box" stroke="#6b7280" stroke-width="1.4"/>
  <text x="60" y="352" class="label">Channel adapter (one small service)</text>
  <rect x="60" y="364" width="120" height="26" rx="13" class="pill"/>
  <text x="120" y="381" text-anchor="middle" class="sub">poller</text>
  <rect x="200" y="364" width="170" height="26" rx="13" class="pill"/>
  <text x="285" y="381" text-anchor="middle" class="sub">router (+tag → colleague)</text>
  <rect x="390" y="364" width="150" height="26" rx="13" class="pill"/>
  <text x="465" y="381" text-anchor="middle" class="sub">turn runner (×2)</text>
  <rect x="560" y="364" width="120" height="26" rx="13" class="pill"/>
  <text x="620" y="381" text-anchor="middle" class="sub">reply relay</text>
  <rect x="700" y="364" width="80" height="26" rx="13" class="pill"/>
  <text x="740" y="381" text-anchor="middle" class="sub">trace tap</text>
  <line x1="180" y1="377" x2="198" y2="377" class="edge" marker-end="url(#arr)"/>
  <line x1="370" y1="377" x2="388" y2="377" class="edge" marker-end="url(#arr)"/>
  <line x1="540" y1="377" x2="558" y2="377" class="edge" marker-end="url(#arr)"/>
  <circle cx="285" cy="404" r="9" class="stepDot"/><text x="285" y="408" text-anchor="middle" class="step">3</text>
  <text x="300" y="408" class="edgeLabel">me+vanessa@ → vanessa · thread → conversation (SQLite map)</text>

  <!-- step 4: sendUserTurn down to codex -->
  <line x1="465" y1="418" x2="465" y2="452" class="edge" marker-end="url(#arr)"/>
  <circle cx="479" cy="436" r="9" class="stepDot"/><text x="479" y="440" text-anchor="middle" class="step">4</text>
  <text x="325" y="440" class="edgeLabel">JSON-RPC sendUserTurn</text>

  <!-- step 6: reply text back up to relay -->
  <path d="M 560 462 Q 620 440 620 392" class="edge" fill="none" marker-end="url(#arr)"/>
  <circle cx="612" cy="430" r="9" class="stepDot"/><text x="612" y="434" text-anchor="middle" class="step">6</text>

  <!-- codex box -->
  <rect x="40" y="452" width="520" height="106" rx="8" class="box"/>
  <text x="60" y="474" class="label">codex app-server — official harness, unmodified</text>
  <rect x="60" y="486" width="220" height="58" rx="8" class="boxAgent"/>
  <text x="76" y="506" class="label">Vanessa turn</text>
  <text x="76" y="521" class="port">sandbox: workspace-write</text>
  <text x="76" y="535" class="port">approval: never</text>
  <rect x="300" y="486" width="240" height="58" rx="8" class="pill"/>
  <text x="320" y="506" class="sub">MCP tools · your files (workspace)</text>
  <text x="320" y="521" class="sub">LLM call = only other outbound line</text>
  <text x="320" y="535" class="port">HTTPS → cloud API / intranet vLLM</text>
  <circle cx="290" cy="515" r="9" class="stepDotAccent"/><text x="290" y="519" text-anchor="middle" class="step">5</text>

  <!-- traces panel -->
  <rect x="580" y="452" width="220" height="106" rx="8" class="boxShared"/>
  <text x="596" y="474" class="label">Traces</text>
  <text x="596" y="492" class="port">traces/audit.jsonl</text>
  <text x="596" y="506" class="sub">every event, adapter-written</text>
  <text x="596" y="524" class="port">~/.codex/sessions/*.jsonl</text>
  <text x="596" y="538" class="sub">full rollout, codex-written</text>
  <path d="M 740 392 L 740 450" class="edgeAccent edgeDash" marker-end="url(#arrAccent)"/>

  <!-- ===== step legend ===== -->
  <text x="20" y="608" class="tier">ONE MESSAGE, END TO END</text>
  <text x="20" y="628" class="sub">① You mail me+vanessa@ from anywhere ② Poller's next outbound delta call brings the message down ③ Router: plus-tag → Vanessa, thread → session</text>
  <text x="20" y="646" class="sub">④ Turn sent to the harness ⑤ Vanessa works in the sandbox — files stay local, only the LLM call leaves ⑥ Final answer handed to the relay</text>
  <text x="20" y="664" class="sub">⑦ Reply sent via Graph; original moved to Processed (= the queue ack) ⑧ Answer lands in the same mail thread on all your devices</text>
  <text x="20" y="688" class="sub">Crash at any step before ⑦? The message is still in Inbox — the next poll retries it. The mailbox is the queue; no queue service exists on the laptop.</text>
</svg>
