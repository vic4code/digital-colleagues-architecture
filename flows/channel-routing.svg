<svg viewBox="0 0 780 650" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title>Flow — one interaction surface and bidirectional service tools</title>
  <desc>The compatibility filename is retained, but multi-channel routing is superseded. Humans use one interaction surface. Service events enter through integration tools, the colleague decides and works, and approved actions return through those same tools.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <style>
    .label { font-size: 13px; font-weight: 500; fill: #111827; }
    .sub { font-size: 11px; fill: #6b7280; }
    .mono { font-size: 10px; fill: #6b7280; font-family: ui-monospace, monospace; }
    .tier { font-size: 11px; font-weight: 700; fill: #4b5563; letter-spacing: 0.5px; }
    .edge { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
    .edgeDash { stroke-dasharray: 4 3; }
    .edgeAccent { stroke: #c2410c; stroke-width: 1.3; fill: none; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .boxAgent { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.3; }
    .boxShared { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1; }
    .pill { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
  </style>

  <text x="20" y="22" class="tier">FLOW · ONE COLLEAGUE INTERFACE · SERVICE EVENTS IN · APPROVED ACTIONS OUT</text>

  <text x="20" y="52" class="tier">PATH A · HUMAN STARTS FACE-TO-FACE</text>
  <rect x="40" y="66" width="150" height="54" rx="7" class="box"/>
  <text x="115" y="88" text-anchor="middle" class="label">Person</text>
  <text x="115" y="105" text-anchor="middle" class="sub">states intent once</text>
  <line x1="190" y1="93" x2="276" y2="93" class="edge" marker-end="url(#arr)"/>
  <rect x="278" y="66" width="222" height="54" rx="7" class="box"/>
  <text x="389" y="88" text-anchor="middle" class="label">ONE INTERACTION SURFACE</text>
  <text x="389" y="105" text-anchor="middle" class="sub">same identity · memory · session</text>
  <line x1="500" y1="93" x2="586" y2="93" class="edge" marker-end="url(#arr)"/>
  <rect x="588" y="66" width="152" height="54" rx="7" class="boxAgent"/>
  <text x="664" y="88" text-anchor="middle" class="label">Digital colleague</text>
  <text x="664" y="105" text-anchor="middle" class="sub">understands the work</text>

  <text x="20" y="158" class="tier">PATH B · A SERVICE EVENT STARTS OR RESUMES WORK</text>
  <rect x="40" y="172" width="190" height="66" rx="7" class="boxShared"/>
  <text x="135" y="194" text-anchor="middle" class="label">Service event</text>
  <text x="135" y="211" text-anchor="middle" class="sub">mail · mention · assignment</text>
  <text x="135" y="226" text-anchor="middle" class="mono">untrusted content + provenance</text>
  <line x1="230" y1="205" x2="302" y2="205" class="edgeAccent" marker-end="url(#arrAccent)"/>
  <rect x="304" y="172" width="190" height="66" rx="7" class="box"/>
  <text x="399" y="194" text-anchor="middle" class="label">Integration tool boundary</text>
  <text x="399" y="211" text-anchor="middle" class="sub">normalize · authenticate · dedupe</text>
  <text x="399" y="226" text-anchor="middle" class="mono">service_event → task candidate</text>
  <line x1="494" y1="205" x2="586" y2="205" class="edgeAccent" marker-end="url(#arrAccent)"/>
  <rect x="588" y="172" width="152" height="66" rx="7" class="boxAgent"/>
  <text x="664" y="194" text-anchor="middle" class="label">Digital colleague</text>
  <text x="664" y="211" text-anchor="middle" class="sub">accept · clarify · ignore</text>
  <text x="664" y="226" text-anchor="middle" class="mono">persona + skill + policy</text>

  <line x1="664" y1="238" x2="664" y2="276" class="edge" marker-end="url(#arr)"/>

  <text x="20" y="294" class="tier">ONE TASK LIFECYCLE · INDEPENDENT OF HOW IT STARTED</text>
  <rect x="40" y="308" width="700" height="104" rx="9" class="boxAgent"/>
  <rect x="58" y="330" width="122" height="42" rx="21" class="pill"/>
  <text x="119" y="355" text-anchor="middle" class="label">1 · queue</text>
  <line x1="180" y1="351" x2="210" y2="351" class="edge" marker-end="url(#arr)"/>
  <rect x="212" y="330" width="122" height="42" rx="21" class="pill"/>
  <text x="273" y="355" text-anchor="middle" class="label">2 · plan</text>
  <line x1="334" y1="351" x2="364" y2="351" class="edge" marker-end="url(#arr)"/>
  <rect x="366" y="330" width="122" height="42" rx="21" class="pill"/>
  <text x="427" y="355" text-anchor="middle" class="label">3 · use tools</text>
  <line x1="488" y1="351" x2="518" y2="351" class="edge" marker-end="url(#arr)"/>
  <rect x="520" y="330" width="122" height="42" rx="21" class="pill"/>
  <text x="581" y="355" text-anchor="middle" class="label">4 · approve</text>
  <line x1="642" y1="351" x2="672" y2="351" class="edge" marker-end="url(#arr)"/>
  <rect x="674" y="330" width="48" height="42" rx="21" class="pill"/>
  <text x="698" y="355" text-anchor="middle" class="label">✓</text>
  <text x="58" y="395" class="sub">The session remains visible from the one interaction surface, even when a service event initiated the task.</text>

  <line x1="390" y1="412" x2="390" y2="448" class="edgeAccent" marker-end="url(#arrAccent)"/>

  <text x="20" y="470" class="tier">RESULTS RETURN THROUGH THE RIGHT TOOL, NOT A NEW CONVERSATION MODEL</text>
  <rect x="40" y="484" width="700" height="72" rx="8" class="boxShared"/>
  <text x="58" y="506" class="label">Colleague chooses an approved action</text>
  <text x="58" y="524" class="sub">reply in Outlook · post in Slack · update Linear · write a document · schedule a meeting · notify the face-to-face surface</text>
  <text x="58" y="542" class="mono">same colleague_id · same task_id · same permission boundary · same audit correlation</text>

  <text x="20" y="588" class="tier">NON-NEGOTIABLES</text>
  <text x="20" y="608" class="sub">① A new service adds a tool, not a new colleague interface.  ② Inbound content is untrusted.  ③ Side effects obey least privilege + approval.</text>
  <text x="20" y="628" class="sub">④ Every event, decision, tool call, and outbound action is correlated and auditable.  ⑤ Multi-channel routing is superseded by ADR-019.</text>
</svg>
